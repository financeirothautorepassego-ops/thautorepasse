<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>TH Auto Repasse</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
:root{
  --bg:#0B0B10;--s1:#111118;--s2:#181824;--s3:#1E1E2C;
  --line:#25253A;--line2:#303048;
  --tx:#E8E4F2;--tx2:#A8A2BC;--tx3:#64607A;
  --gold:#C8A044;--gold2:#E4BC60;--gold3:#886A1C;--gdim:rgba(200,160,68,.1);
  --red:#E05050;--rdim:rgba(224,80,80,.1);--rb:rgba(224,80,80,.2);
  --ok:#38C880;--odim:rgba(56,200,128,.1);--ob:rgba(56,200,128,.2);
  --warn:#E89030;--wdim:rgba(232,144,48,.1);--wb:rgba(232,144,48,.2);
  --blue:#4A88E0;--bdim:rgba(74,136,224,.1);--bb:rgba(74,136,224,.2);
  --purple:#9060E0;--pdim:rgba(144,96,224,.1);--pb:rgba(144,96,224,.2);
  --r:12px;--rs:8px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;font-size:14px;line-height:1.5}

/* LOGIN */
.lw{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px}
.lb{background:var(--s1);border:1px solid var(--line);border-radius:20px;padding:36px 28px;width:100%;max-width:380px;box-shadow:0 24px 64px rgba(0,0,0,.6)}
.lmark{width:54px;height:54px;background:linear-gradient(135deg,var(--gold2),var(--gold3));border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:#0B0B10;margin:0 auto 16px;box-shadow:0 6px 20px rgba(200,160,68,.3)}
.lh{font-size:20px;font-weight:700;text-align:center;margin-bottom:4px}
.ls{font-size:13px;color:var(--tx3);text-align:center;margin-bottom:24px}
.lf{margin-bottom:14px}
.lf label{display:block;font-size:11px;font-weight:600;color:var(--tx3);margin-bottom:5px;text-transform:uppercase;letter-spacing:.05em}
.lf input{width:100%;padding:11px 13px;background:var(--bg);border:1px solid var(--line2);border-radius:var(--rs);color:var(--tx);font-size:14px;outline:none;font-family:inherit;transition:border-color .15s}
.lf input:focus{border-color:var(--gold)}
.lbtn{width:100%;background:linear-gradient(135deg,var(--gold2),var(--gold3));border:none;border-radius:var(--rs);padding:12px;color:#0B0B10;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;margin-top:4px}
.lerr{background:var(--rdim);border:1px solid var(--rb);border-radius:var(--rs);padding:9px 12px;font-size:12px;color:#FF9090;margin-top:10px;display:none;text-align:center}

/* APP */
#app{display:none;flex-direction:column;height:100vh;overflow:hidden}

/* TOPBAR */
.tb{background:var(--s1);border-bottom:1px solid var(--line);padding:0 16px;height:52px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.tb-l{display:flex;align-items:center;gap:10px}
.tb-mark{width:32px;height:32px;background:linear-gradient(135deg,var(--gold2),var(--gold3));border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#0B0B10;flex-shrink:0}
.tb-name{font-size:14px;font-weight:700;color:var(--gold)}
.tb-r{display:flex;align-items:center;gap:8px}
.tb-user{font-size:12px;color:var(--tx3);font-weight:500}
.sync{width:6px;height:6px;border-radius:50%;background:var(--tx3);flex-shrink:0;transition:background .3s}
.sync.on{background:var(--ok);box-shadow:0 0 6px rgba(56,200,128,.4)}
.tb-exit{background:none;border:1px solid var(--line2);border-radius:6px;color:var(--tx3);cursor:pointer;font-size:12px;font-family:inherit;padding:5px 10px;font-weight:500}
.tb-notif{position:relative;background:none;border:none;cursor:pointer;padding:4px;color:var(--tx3);font-size:18px}
.tb-notif-badge{position:absolute;top:0;right:0;width:8px;height:8px;border-radius:50%;background:var(--red);display:none}
.tb-notif-badge.show{display:block}

/* NAV */
.nav{background:var(--s1);border-bottom:1px solid var(--line);display:flex;padding:0 12px;overflow-x:auto;flex-shrink:0}
.nav::-webkit-scrollbar{display:none}
.ntab{padding:11px 14px;border:none;background:transparent;color:var(--tx3);cursor:pointer;font-size:13px;font-weight:500;font-family:inherit;white-space:nowrap;border-bottom:2px solid transparent;transition:all .15s;display:flex;align-items:center;gap:6px}
.ntab:hover{color:var(--tx2)}
.ntab.active{color:var(--gold);border-bottom-color:var(--gold);font-weight:600}
.nbdg{border-radius:99px;font-size:10px;padding:1px 6px;font-weight:700;line-height:1.4}
.nbdg-r{background:var(--red);color:#fff}
.nbdg-g{background:var(--gold);color:#0B0B10}

/* DASHBOARD */
.dash{flex:1;overflow-y:auto;padding:14px}
.dash-hello{font-size:20px;font-weight:700;margin-bottom:2px}
.dash-sub{font-size:13px;color:var(--tx3);margin-bottom:18px}
/* MINHA VEZ — destaque principal */
.minha-vez{background:linear-gradient(135deg,rgba(200,160,68,.15),rgba(200,160,68,.05));border:1px solid rgba(200,160,68,.3);border-radius:var(--r);padding:14px 16px;margin-bottom:16px}
.mv-title{font-size:12px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.mv-item{background:var(--s1);border:1px solid var(--line);border-radius:var(--rs);padding:11px 13px;margin-bottom:7px;display:flex;align-items:center;gap:10px;cursor:pointer;transition:all .15s}
.mv-item:hover{border-color:var(--gold);transform:translateX(3px)}
.mv-item.urgent{border-color:var(--rb);background:rgba(224,80,80,.04)}
.mv-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.mv-info{flex:1;min-width:0}
.mv-plate{font-size:13px;font-weight:700;color:var(--gold);font-family:'Courier New',monospace;letter-spacing:.06em}
.mv-model{font-size:12px;color:var(--tx2);margin-top:1px}
.mv-action{font-size:11px;color:var(--tx3);margin-top:3px;font-weight:500}
.mv-timer{font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap;flex-shrink:0}
/* NOTIFICAÇÕES */
.notif-item{background:var(--s1);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:var(--rs);padding:11px 13px;margin-bottom:7px;cursor:pointer;transition:all .15s;animation:slideIn .3s ease}
.notif-item:hover{border-color:var(--gold)}
.notif-item.unread{background:rgba(200,160,68,.05)}
@keyframes slideIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.notif-msg{font-size:13px;font-weight:500;color:var(--tx);margin-bottom:3px}
.notif-msg strong{color:var(--gold)}
.notif-time{font-size:11px;color:var(--tx3)}
/* KPI MINI */
.kpi-row{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:16px}
.kpi{background:var(--s1);border:1px solid var(--line);border-radius:var(--rs);padding:12px 14px;cursor:pointer}
.kpi:hover{border-color:var(--line2)}
.kpi-val{font-size:24px;font-weight:800;letter-spacing:-1px}
.kpi-lbl{font-size:11px;color:var(--tx3);margin-top:2px;font-weight:500}
/* ETAPA RESUMO */
.etapa-resumo{background:var(--s1);border:1px solid var(--line);border-radius:var(--rs);padding:11px 13px;margin-bottom:7px;display:flex;align-items:center;gap:10px;cursor:pointer}
.etapa-resumo:hover{border-color:var(--line2)}
.er-ico{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.er-info{flex:1}
.er-name{font-size:13px;font-weight:600;color:var(--tx)}
.er-resp{font-size:11px;color:var(--tx3);margin-top:1px}
.er-cnt{font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px}

/* KANBAN */
.kan-wrap{flex:1;display:flex;overflow:hidden}
.kan-scroll{flex:1;overflow-x:auto;overflow-y:hidden;display:flex;padding:12px;gap:10px}
.kan-scroll::-webkit-scrollbar{height:3px}
.kan-scroll::-webkit-scrollbar-thumb{background:var(--line2);border-radius:99px}
.col{flex-shrink:0;width:260px;display:flex;flex-direction:column;max-height:100%;transition:all .2s}
@media(max-width:500px){.col{width:calc(100vw - 48px)}}
.col-h{padding:10px 12px;border-radius:var(--r) var(--r) 0 0;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.col-title{font-size:13px;font-weight:700}
.col-cnt{font-size:11px;font-weight:700;background:rgba(0,0,0,.25);border-radius:99px;padding:2px 8px}
.col-resp{font-size:11px;padding:4px 12px 6px;font-weight:500}
.col-body{flex:1;overflow-y:auto;padding:6px;background:rgba(255,255,255,.015);border-radius:0 0 var(--r) var(--r);border:1px solid rgba(255,255,255,.04);border-top:none}
.col-body::-webkit-scrollbar{width:2px}
.col-body::-webkit-scrollbar-thumb{background:var(--line2);border-radius:99px}
/* COLUNA DESTACADA — quando é do usuário */
.col.minha-col .col-h{box-shadow:0 0 0 1px rgba(200,160,68,.3) inset}
.col.minha-col .col-body{background:rgba(200,160,68,.03);border-color:rgba(200,160,68,.15)}
.col-minha-tag{font-size:9px;font-weight:700;padding:2px 7px;border-radius:99px;background:rgba(200,160,68,.2);color:var(--gold);border:1px solid rgba(200,160,68,.3);text-transform:uppercase;letter-spacing:.04em}

/* CARD */
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--rs);padding:13px;margin-bottom:8px;cursor:pointer;transition:all .15s;border-left:3px solid;position:relative;overflow:hidden}
.card:hover{border-color:var(--line2);box-shadow:0 4px 16px rgba(0,0,0,.3);transform:translateY(-1px)}
.card.late{box-shadow:0 0 0 1px rgba(224,80,80,.2) inset}
.card.pulse{animation:cpulse 2s ease-in-out infinite}
@keyframes cpulse{0%,100%{box-shadow:0 0 0 1px rgba(144,96,224,.15) inset}50%{box-shadow:0 0 16px rgba(144,96,224,.2),0 0 0 1px rgba(144,96,224,.35) inset}}
/* BANNER "SUA VEZ" no topo do card */
.card-minha-vez{background:linear-gradient(90deg,rgba(200,160,68,.25),rgba(200,160,68,.05));border-bottom:1px solid rgba(200,160,68,.2);margin:-13px -13px 10px;padding:5px 13px;font-size:10px;font-weight:700;color:var(--gold);letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:center;gap:5px}
.card-minha-vez-dot{width:6px;height:6px;border-radius:50%;background:var(--gold);animation:blink 1.2s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.c-model{font-size:14px;font-weight:700;color:var(--tx);margin-bottom:3px}
.c-plate{font-size:12px;font-weight:600;color:var(--gold);letter-spacing:.08em;font-family:'Courier New',monospace;margin-bottom:4px}
.c-loc{font-size:11px;color:var(--tx3);margin-bottom:5px}
.c-val{font-size:13px;font-weight:700;color:var(--gold2);margin-bottom:6px}
.c-row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.c-resp{font-size:10px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--gdim);color:var(--gold);border:1px solid rgba(200,160,68,.2)}
.c-timer{font-size:10px;font-weight:600;padding:2px 8px;border-radius:99px;display:inline-flex;align-items:center;gap:3px}
.tok{background:var(--odim);color:var(--ok);border:1px solid var(--ob)}
.twarn{background:var(--wdim);color:var(--warn);border:1px solid var(--wb)}
.terr{background:var(--rdim);color:var(--red);border:1px solid var(--rb)}
.c-status{font-size:11px;font-weight:500;color:var(--tx3);margin-top:5px}
.c-contra{margin-top:6px;background:var(--pdim);border:1px solid var(--pb);border-radius:6px;padding:6px 9px;font-size:11px;color:#C090FF;animation:cpulse 2s ease-in-out infinite}

/* PAINEL */
.pov{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:100;display:flex;justify-content:flex-end}
.panel{width:440px;max-width:100vw;background:var(--s1);height:100%;overflow-y:auto;border-left:1px solid var(--line);box-shadow:-12px 0 40px rgba(0,0,0,.5)}
.ph{padding:16px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--s1);z-index:1;display:flex;align-items:flex-start;justify-content:space-between}
.pb{padding:16px 18px}
.psec{margin-bottom:18px}
.pt{font-size:10px;font-weight:700;color:var(--gold3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.irow{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.03);font-size:12px}
.irow:last-child{border:none}
/* PERMISSÃO */
.perm-banner{background:var(--wdim);border:1px solid var(--wb);border-radius:var(--rs);padding:10px 13px;font-size:12px;color:var(--warn);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.perm-ok{background:var(--odim);border:1px solid var(--ob);border-radius:var(--rs);padding:10px 13px;font-size:12px;color:var(--ok);margin-bottom:14px;display:flex;align-items:center;gap:8px;font-weight:600}

/* TIMELINE */
.tl{display:flex;flex-direction:column}
.tli{display:flex;gap:11px;padding-bottom:16px}
.tli:last-child{padding-bottom:0}
.tl-l{display:flex;flex-direction:column;align-items:center;width:28px;flex-shrink:0}
.tl-dot{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;border:1.5px solid;flex-shrink:0}
.tl-line{flex:1;width:1.5px;margin:2px 0;min-height:12px;border-radius:99px}
.tl-c{flex:1;padding-top:3px}
.tl-msg{font-size:13px;font-weight:500;color:var(--tx);line-height:1.4;margin-bottom:2px}
.tl-msg strong{color:var(--gold)}
.tl-time{font-size:11px;color:var(--tx3)}
.tl-obs{font-size:12px;color:var(--tx2);background:var(--s2);border-radius:6px;padding:6px 9px;margin-top:5px;font-style:italic;line-height:1.4}

/* WA */
.wa-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:4px}
.wa-btn{background:var(--s2);border:1px solid var(--line2);border-radius:var(--rs);padding:8px 10px;cursor:pointer;font-size:11px;font-weight:600;color:var(--tx2);text-align:left;font-family:inherit;transition:all .15s;display:flex;align-items:center;gap:6px;line-height:1.3}
.wa-btn:hover{border-color:var(--gold);color:var(--gold)}

/* MODAL */
.mov{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:flex-end;justify-content:center;z-index:300}
@media(min-width:600px){.mov{align-items:center;padding:16px}}
.modal{background:var(--s1);border-radius:18px 18px 0 0;padding:20px 18px 32px;width:100%;max-width:500px;max-height:88vh;overflow-y:auto;border:1px solid var(--line);border-bottom:none}
@media(min-width:600px){.modal{border-radius:18px;border-bottom:1px solid var(--line)}}
.mh{width:36px;height:3px;background:var(--line2);border-radius:99px;margin:0 auto 16px}
@media(min-width:600px){.mh{display:none}}
.mt{font-size:15px;font-weight:700;color:var(--gold);margin-bottom:14px}
.mf{margin-bottom:12px}
.mf label{display:block;font-size:10px;font-weight:600;color:var(--tx3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.mf input,.mf select,.mf textarea{width:100%;padding:10px 12px;background:var(--bg);border:1px solid var(--line2);border-radius:var(--rs);color:var(--tx);font-size:13px;outline:none;font-family:inherit;transition:border-color .15s}
.mf input:focus,.mf select:focus,.mf textarea:focus{border-color:var(--gold)}
.mf select option{background:var(--s2)}
.mf textarea{resize:vertical;min-height:68px}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}

/* BUTTONS */
.btn{padding:8px 13px;border-radius:var(--rs);border:none;cursor:pointer;font-weight:600;font-size:12px;display:inline-flex;align-items:center;gap:5px;font-family:inherit;transition:all .15s;white-space:nowrap}
.btn:active{transform:scale(.96)}
.bgold{background:linear-gradient(135deg,var(--gold2),var(--gold3));color:#0B0B10;font-weight:700}
.bghost{background:var(--s2);color:var(--tx2);border:1px solid var(--line)}
.bred{background:var(--rdim);color:var(--red);border:1px solid var(--rb)}
.bok{background:var(--odim);color:var(--ok);border:1px solid var(--ob)}
.bwarn{background:var(--wdim);color:var(--warn);border:1px solid var(--wb)}
.bblue{background:var(--bdim);color:var(--blue);border:1px solid var(--bb)}
.bpurple{background:var(--pdim);color:var(--purple);border:1px solid var(--pb)}
.bsm{padding:5px 10px;font-size:11px}
.bfull{width:100%;justify-content:center}
.btn-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}

/* MISC */
#notif{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:10px 18px;border-radius:var(--rs);font-weight:600;font-size:13px;z-index:999;opacity:0;pointer-events:none;transition:opacity .25s;white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,.4)}
#notif.show{opacity:1}
#notif.ok{background:var(--s2);color:var(--ok);border:1px solid var(--ob)}
#notif.err{background:var(--s2);color:var(--red);border:1px solid var(--rb)}
.cov{position:fixed;inset:0;background:rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center;z-index:500;padding:16px}
.cbox{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:24px;max-width:300px;width:100%;text-align:center}
.spinner{width:24px;height:24px;border:2px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 10px}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:40px 16px;color:var(--tx3);font-size:13px}
.sdiv{font-size:10px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.07em;margin:14px 0 8px;display:flex;align-items:center;gap:8px}
.sdiv::after{content:'';flex:1;height:1px;background:var(--line)}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.st{font-size:16px;font-weight:700;color:var(--gold)}
.urow{background:var(--s1);border:1px solid var(--line);border-radius:var(--rs);padding:12px 13px;margin-bottom:7px;display:flex;align-items:center;gap:10px}
.uav{width:34px;height:34px;border-radius:50%;background:var(--gdim);border:1px solid rgba(200,160,68,.2);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--gold);flex-shrink:0}
.srow{background:var(--s1);border:1px solid var(--line);border-radius:var(--rs);padding:12px 13px;margin-bottom:8px;display:flex;align-items:center;gap:12px}
.sinp{width:60px;padding:6px 8px;background:var(--bg);border:1px solid var(--line2);border-radius:6px;color:var(--tx);font-size:14px;font-weight:700;text-align:center;outline:none;font-family:inherit}
.sinp:focus{border-color:var(--gold)}
.wa-edit{width:100%;padding:9px 12px;background:var(--bg);border:1px solid var(--line2);border-radius:var(--rs);color:var(--tx);font-size:12px;outline:none;font-family:inherit;resize:vertical;min-height:80px}
.wa-edit:focus{border-color:var(--gold)}
</style>
</head>
<body>

<div class="lw" id="lWrap">
  <div class="lb">
    <div class="lmark">TH</div>
    <div class="lh">TH Auto Repasse</div>
    <div class="ls">Painel Operacional</div>
    <div class="lf"><label>Usuário</label>
      <input type="text" id="lU" placeholder="seu.usuario" onkeydown="if(event.key==='Enter')document.getElementById('lP').focus()">
    </div>
    <div class="lf"><label>Senha</label>
      <input type="password" id="lP" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <button class="lbtn" onclick="doLogin()">Entrar</button>
    <div class="lerr" id="lErr">Usuário ou senha incorretos</div>
  </div>
</div>

<div id="app">
  <div class="tb">
    <div class="tb-l">

};

var ACAO={

};

function getCol(k){return COLS.find(function(c){return c.k===k;})||{k:k,l:k,icon:'',color:'#888',resp:'',perfis:[]};}
function podeEditar(v){
  if(!U)return false;
  if(U.perfil==='admin')return true;
  var col=getCol(v.coluna);
  return col.perfis.indexOf(U.perfil)>=0||U.etapas.indexOf(v.coluna)>=0||U.etapas.indexOf('all')>=0;
}
function ehMinhaCol(colKey){
  if(!U)return false;
  if(U.perfil==='admin')return true;
  var col=getCol(colKey);
  return col.perfis.indexOf(U.perfil)>=0||U.etapas.indexOf(colKey)>=0;
}

// ═══ TIMER ═════════════════════════════════════════
function tInfo(col,inicio){
  var h=Math.floor((Date.now()-new Date(inicio||Date.now()).getTime())/3600000);
  var prazoH=(CF.prazos[col]||2)*24;
  var p=Math.min(100,Math.round((h/prazoH)*100));
  var cls=p<50?'tok':p<85?'twarn':'terr';
  var dias=Math.floor(h/24);
  var lbl=dias===0?(h+'h'):(dias===1?'1 dia':(dias+' dias'));
  return{h:h,dias:dias,lbl:lbl,cls:cls,p:p,late:p>=100};
}

// ═══ NOTIFICAÇÕES INTERNAS ═════════════════════════
// Salvas no Firebase — cada usuário tem suas notificações
var NOTIFS=[];
function addNotif(paraNome,msg,vidId){
  if(!db)return;
  db.collection('notifs').add({para:paraNome,msg:msg,vidId:vidId||'',data:now(),lida:false});
}
function loadNotifs(){
  if(!db||!U)return;
  db.collection('notifs').where('para','==',U.nome).where('lida','==',false)
  .onSnapshot(function(s){
    NOTIFS=s.docs.map(function(d){return Object.assign({id:d.id},d.data());});
    var badge=document.getElementById('notifBadge');
    if(badge)badge.className='tb-notif-badge'+(NOTIFS.length?' show':'');
    if(TAB==='dash')rMain();
  });
}
function marcarLidas(){
  NOTIFS.forEach(function(n){
    db.collection('notifs').doc(n.id).update({lida:true});
  });
  NOTIFS=[];
  var badge=document.getElementById('notifBadge');
  if(badge)badge.className='tb-notif-badge';
}

// ═══ STATE ═════════════════════════════════════════
var db=null,VEI=[],U=null,TAB='dash';

// ═══ LOGIN ═════════════════════════════════════════
function doLogin(){
  var l=(document.getElementById('lU').value||'').trim().toLowerCase();
  var p=document.getElementById('lP').value||'';
  var u=UD.find(function(x){return x.login===l&&x.senha===p&&x.ativo;});
  if(u){
    U={id:u.id,nome:u.nome,login:l,perfil:u.perfil,etapas:u.etapas};
    document.getElementById('lWrap').style.display='none';
    document.getElementById('app').style.display='flex';
    document.getElementById('tbU').textContent=u.nome;
    document.getElementById('lErr').style.display='none';
    initFire();bNav();setTab('dash');
  }else{
    document.getElementById('lErr').style.display='block';
    document.getElementById('lP').value='';document.getElementById('lP').focus();
  }

function doLogout(){
  U=null;VEI=[];NOTIFS=[];
  document.getElementById('app').style.display='none';
  document.getElementById('lWrap').style.display='flex';

// ═══ HELPERS ═══════════════════════════════════════
function now(){return new Date().toISOString();}
function fd(d){if(!d)return'–';var p=d.split('T')[0].split('-');return p[2]+'/'+p[1]+'/'+p[0];}
function fdt(d){if(!d)return'–';var dt=new Date(d);return dt.toLocaleDateString('pt-BR')+' às '+dt.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});}
function frel(d){if(!d)return'agora';var m=Math.floor((Date.now()-new Date(d).getTime())/60000);if(m<1)return'agora';if(m<60)return m+'min atrás';var h=Math.floor(m/60);if(h<24)return h+'h atrás';return Math.floor(h/24)+'d atrás';}
function fc(v){if(!v&&v!==0)return'–';return'R$ '+Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2});}
function gv(id){var e=document.getElementById(id);return e?e.value:'';}
function nomes(){return UD.filter(function(u){return u.ativo;}).map(function(u){return'<option value="'+u.nome+'">'+u.nome+'</option>';}).join('');}
function notify(msg,t){var el=document.getElementById('notif');el.textContent=msg;el.className='show '+(t||'ok');setTimeout(function(){el.className='';},3000);}
function cDlg(msg,fn){
  var d=document.createElement('div');d.className='cov';d.id='cOv';
  d.innerHTML='<div class="cbox"><p style="color:var(--tx2);font-size:13px;margin-bottom:16px;line-height:1.6">'+msg+'</p>'+
    '<div style="display:flex;gap:8px;justify-content:center">'+
    '<button class="btn bghost bsm" onclick="document.getElementById(\'cOv\').remove()">Cancelar</button>'+
    '<button class="btn bgold bsm" id="cY">Confirmar</button></div></div>';
  document.body.appendChild(d);
  document.getElementById('cY').onclick=function(){d.remove();fn();};
}
function feedMsg(h){

    criado:'<strong>'+n+'</strong> criou a proposta',

// ═══ NAV ═══════════════════════════════════════════
function bNav(){
  var ativos=VEI.filter(function(v){return FINAIS.indexOf(v.coluna)<0;});
  var minhas=ativos.filter(function(v){return podeEditar(v);});
  var late=ativos.filter(function(v){return tInfo(v.coluna,v.colInicio).late;}).length;
  var tabs=[
    {k:'dash', l:'Início',     cnt:NOTIFS.length, cc:'nbdg-r'},
    {k:'kanban',l:'Painel',    cnt:0},
    {k:'pend', l:'Minhas Tarefas',cnt:minhas.length,cc:'nbdg-g'},
    {k:'hist', l:'Histórico',  cnt:0},
    {k:'admin',l:'Admin',      cnt:0, admin:true},
  ];
  document.getElementById('nav').innerHTML=tabs.map(function(t){
    if(t.admin&&U&&U.perfil!=='admin')return'';
    return'<button class="ntab'+(TAB===t.k?' active':'')+'" onclick="setTab(\''+t.k+'\')">'+t.l+
      (t.cnt>0?'<span class="nbdg '+(t.cc||'nbdg-r')+'">'+t.cnt+'</span>':'')+
      '</button>';
  }).join('');
}
function setTab(t){
  TAB=t;
  if(t==='dash')marcarLidas();
  bNav();rMain();
}

// ═══ RENDER ════════════════════════════════════════
function rMain(){
  var m=document.getElementById('main');
  if(TAB==='dash')rDash(m);
  else if(TAB==='kanban')rKanban(m);
  else if(TAB==='pend')rPend(m);
  else if(TAB==='hist')rHist(m);
  else if(TAB==='admin')rAdmin(m);
}

// ═══ DASHBOARD ═════════════════════════════════════
function rDash(m){
  var h=new Date().getHours();
  var saud=h<12?'Bom dia':'h<18?\'Boa tarde\':\'Boa noite\'';
  saud=h<12?'Bom dia, ':h<18?'Boa tarde, ':'Boa noite, ';
  var ativos=VEI.filter(function(v){return FINAIS.indexOf(v.coluna)<0;});
  var minhas=ativos.filter(function(v){return podeEditar(v);});
  var late=ativos.filter(function(v){return tInfo(v.coluna,v.colInicio).late;});

  var html='<div class="dash">';
  html+='<div class="dash-hello">'+saud+U.nome+' 👋</div>';
  html+='<div class="dash-sub">'+new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'})+'</div>';

  // Notificações não lidas
  if(NOTIFS.length){
    html+='<div class="sdiv" style="color:var(--red)">🔔 Notificações · '+NOTIFS.length+'</div>';
    NOTIFS.forEach(function(n){
      html+='<div class="notif-item unread" onclick="abrirPainel(\''+n.vidId+'\')">'+
        '<div class="notif-msg">'+n.msg+'</div>'+
        '<div class="notif-time">'+frel(n.data)+'</div>'+
        '</div>';
    });
  }

  // Minhas tarefas agora
  if(minhas.length){
    minhas.sort(function(a,b){return tInfo(b.coluna,b.colInicio).p-tInfo(a.coluna,a.colInicio).p;});
    html+='<div class="minha-vez"><div class="mv-title"><span class="mv-title">✋ O QUE FAZER AGORA</span></div>';
    minhas.forEach(function(v){
      var col=getCol(v.coluna);var t=tInfo(v.coluna,v.colInicio);
      var dotColor=t.late?'var(--red)':t.p>=50?'var(--warn)':'var(--ok)';
      var acao=ACAO[v.substatus]||('Etapa: '+col.l);
      html+='<div class="mv-item'+(t.late?' urgent':'')+'" onclick="abrirPainel(\''+v.id+'\')">'+
        '<div class="mv-dot" style="background:'+dotColor+'"></div>'+
        '<div class="mv-info">'+
        '<div class="mv-plate">'+v.placa+' <span style="font-family:inherit;font-weight:500;color:var(--tx2);letter-spacing:0;font-size:12px">'+v.modelo+'</span></div>'+
        '<div class="mv-action">→ '+acao+'</div>'+
        '</div>'+
        '<span class="mv-timer '+t.cls+'">'+t.lbl+'</span>'+
        '</div>';
    });
    html+='</div>';
  } else {
    html+='<div class="minha-vez"><div class="mv-title">✋ MINHAS TAREFAS</div>'+
      '<div style="text-align:center;padding:16px;color:var(--tx3);font-size:13px">✓ Nenhuma tarefa pendente para você</div></div>';
  }

  // KPIs
  html+='<div class="kpi-row">';
  [{v:ativos.length,l:'Em andamento',c:'var(--gold)',t:'kanban'},
   {v:late.length,l:'Atrasados',c:'var(--red)',t:'pend'},
   {v:minhas.length,l:'Minhas tarefas',c:'var(--ok)',t:'pend'},
   {v:VEI.filter(function(v){return v.coluna==='finalizado';}).length,l:'Finalizados',c:'var(--blue)',t:'hist'},
  ].forEach(function(k){
    html+='<div class="kpi" onclick="setTab(\''+k.t+'\')">'+
      '<div class="kpi-val" style="color:'+k.c+'">'+k.v+'</div>'+
      '<div class="kpi-lbl">'+k.l+'</div></div>';
  });
  html+='</div>';

  // Visão geral por etapa
  html+='<div class="sdiv">Situação geral</div>';
  COLS.forEach(function(col){
    var veics=ativos.filter(function(v){return v.coluna===col.k;});
    var lateC=veics.filter(function(v){return tInfo(v.coluna,v.colInicio).late;}).length;
    var isMinha=ehMinhaCol(col.k);
    html+='<div class="etapa-resumo" onclick="setTab(\'kanban\')" style="'+(isMinha?'border-color:'+col.color+'33;background:'+col.color+'06':'')+'">'+
      '<div class="er-ico" style="background:'+col.color+'18;color:'+col.color+'">'+col.icon+'</div>'+
      '<div class="er-info">'+
      '<div class="er-name">'+col.l+(isMinha?' <span style="font-size:10px;font-weight:600;color:'+col.color+';background:'+col.color+'18;padding:1px 6px;border-radius:99px;border:1px solid '+col.color+'33">Sua etapa</span>':'')+'</div>'+
      '<div class="er-resp">👤 '+col.resp+'</div>'+
      '</div>'+
      '<span class="er-cnt" style="'+(veics.length?'background:'+col.color+'18;color:'+col.color+';border:1px solid '+col.color+'33':'background:var(--s2);color:var(--tx3)')+'">'+veics.length+'</span>'+
      (lateC?'<span style="font-size:10px;font-weight:700;color:var(--red);background:var(--rdim);padding:2px 8px;border-radius:99px;border:1px solid var(--rb)">'+lateC+' atrasado'+(lateC>1?'s':'')+'</span>':'')+
      '</div>';
  });
  html+='</div>';
  m.innerHTML=html;
}

// ═══ KANBAN ════════════════════════════════════════
function rKanban(m){
  var ativos=VEI.filter(function(v){return FINAIS.indexOf(v.coluna)<0;});
  var html='<div style="padding:8px 12px;background:var(--s1);border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-shrink:0">'+
    '<input id="kS" placeholder="🔍  Buscar placa ou modelo..." style="flex:1;padding:7px 12px;background:var(--bg);border:1px solid var(--line);border-radius:var(--rs);color:var(--tx);font-size:13px;outline:none;font-family:inherit" oninput="rMain()">'+
    '<button class="btn bgold bsm" onclick="abrirNovo()">+ Novo</button></div>'+
    '<div class="kan-wrap"><div class="kan-scroll">';
  var q=(gv('kS')||'').toLowerCase();
  COLS.forEach(function(col){
    var cards=ativos.filter(function(v){return v.coluna===col.k;});
    if(q)cards=cards.filter(function(v){return(v.placa||'').toLowerCase().includes(q)||(v.modelo||'').toLowerCase().includes(q);});
    cards.sort(function(a,b){return tInfo(b.coluna,b.colInicio).p-tInfo(a.coluna,a.colInicio).p;});
    var isMinha=ehMinhaCol(col.k);
    var lateC=cards.filter(function(v){return tInfo(v.coluna,v.colInicio).late;}).length;
    html+='<div class="col'+(isMinha?' minha-col':'')+'">'+
      '<div class="col-h" style="background:'+col.color+'18;border:1px solid '+col.color+'30">'+
      '<span class="col-title" style="color:'+col.color+'">'+col.icon+' '+col.l+'</span>'+
      '<div style="display:flex;align-items:center;gap:5px">'+
      (lateC?'<span style="font-size:9px;font-weight:700;color:var(--red);background:var(--rdim);padding:1px 6px;border-radius:99px">'+lateC+' atras.</span>':'')+
      '<span class="col-cnt" style="color:'+col.color+'">'+cards.length+'</span>'+
      '</div></div>'+
      '<div style="background:'+col.color+'0A;border-left:1px solid '+col.color+'20;border-right:1px solid '+col.color+'20;padding:4px 12px;display:flex;align-items:center;justify-content:space-between">'+
      '<span style="font-size:11px;color:'+col.color+'88;font-weight:500">👤 '+col.resp+'</span>'+
      (isMinha?'<span class="col-minha-tag">Sua etapa ✋</span>':'')+
      '</div>'+
      '<div class="col-body">';
    if(!cards.length)html+='<div class="col-empty">Nenhum veículo</div>';
    cards.forEach(function(v){html+=rCard(v,col);});
    html+='</div></div>';
  });
  html+='</div></div>';
  m.innerHTML=html;
}

function rCard(v,col){
  var t=tInfo(v.coluna,v.colInicio);
  var isContra=v.substatus==='contraproposta';
  var ss=SSL[v.substatus]||v.substatus||'';
  var ehMeu=podeEditar(v);
  return'<div class="card'+(t.late?' late':'')+(isContra?' pulse':'')+'" style="border-left-color:'+col.color+'" onclick="abrirPainel(\''+v.id+'\')">'+
    (ehMeu?'<div class="card-minha-vez"><span class="card-minha-vez-dot"></span> SUA VEZ — AÇÃO NECESSÁRIA</div>':'')+
    '<div class="c-model">'+v.modelo+'</div>'+
    '<div class="c-plate">'+v.placa+'</div>'+
    (v.locadora?'<div class="c-loc">🏢 '+v.locadora+'</div>':'')+
    (v.valor?'<div class="c-val">'+fc(v.valor)+'</div>':'')+
    '<div class="c-row">'+
    '<span class="c-resp">👤 '+v.resp+'</span>'+
    '<span class="c-timer '+t.cls+'">⏱ '+t.lbl+'</span>'+
    '</div>'+
    (ss?'<div class="c-status">'+ss+'</div>':'')+

// ═══ PENDÊNCIAS ════════════════════════════════════
function rPend(m){
  var ativos=VEI.filter(function(v){return FINAIS.indexOf(v.coluna)<0&&podeEditar(v);});
  ativos.sort(function(a,b){return tInfo(b.coluna,b.colInicio).p-tInfo(a.coluna,a.colInicio).p;});
  var html='<div style="flex:1;overflow-y:auto;padding:14px">';
  if(!ativos.length){html+='<div class="empty">✓ Nenhuma tarefa pendente para você</div></div>';m.innerHTML=html;return;}
  var urg=ativos.filter(function(v){return tInfo(v.coluna,v.colInicio).late;});
  var wrn=ativos.filter(function(v){var t=tInfo(v.coluna,v.colInicio);return !t.late&&t.p>=50;});
  var nrm=ativos.filter(function(v){return tInfo(v.coluna,v.colInicio).p<50;});
  function rItem(v){
    var col=getCol(v.coluna);var t=tInfo(v.coluna,v.colInicio);
    var dotColor=t.late?'var(--red)':t.p>=50?'var(--warn)':'var(--ok)';
    var acao=ACAO[v.substatus]||col.l;
    return'<div class="mv-item'+(t.late?' urgent':t.p>=50?' warn':'')+'" onclick="abrirPainel(\''+v.id+'\')">'+
      '<div class="mv-dot" style="background:'+dotColor+'"></div>'+
      '<div class="mv-info">'+
      '<div class="mv-plate">'+v.placa+' <span style="font-family:inherit;font-weight:500;color:var(--tx2);letter-spacing:0;font-size:12px">'+v.modelo+'</span></div>'+
      '<div class="mv-action">'+col.icon+' '+col.l+' → '+acao+'</div>'+
      '</div>'+
      '<span class="mv-timer '+t.cls+'">'+t.lbl+'</span></div>';
  }
  if(urg.length){html+='<div class="sdiv" style="color:var(--red)">🔴 Atrasados · '+urg.length+'</div>';urg.forEach(function(v){html+=rItem(v);});}
  if(wrn.length){html+='<div class="sdiv" style="color:var(--warn)">🟡 Atenção · '+wrn.length+'</div>';wrn.forEach(function(v){html+=rItem(v);});}
  if(nrm.length){html+='<div class="sdiv">🟢 Em dia · '+nrm.length+'</div>';nrm.forEach(function(v){html+=rItem(v);});}
  html+='</div>';
  m.innerHTML=html;
}

// ═══ HISTÓRICO ═════════════════════════════════════
function rHist(m){
  var lista=VEI.filter(function(v){return FINAIS.indexOf(v.coluna)>=0;});
  lista.sort(function(a,b){return new Date(b.updatedAt||0)-new Date(a.updatedAt||0);});
  var html='<div style="flex:1;overflow-y:auto;padding:14px">';
  if(!lista.length){html+='<div class="empty">Histórico vazio</div></div>';m.innerHTML=html;return;}
  lista.forEach(function(v){
    var c=v.coluna==='cancelado_arq'?'var(--red)':'var(--ok)';
    var lb=v.coluna==='cancelado_arq'?'✕ Cancelado':'✓ Finalizado';
    html+='<div class="card" style="border-left-color:'+c+'" onclick="abrirPainel(\''+v.id+'\')">'+
      '<div class="c-model">'+v.modelo+'</div><div class="c-plate">'+v.placa+'</div>'+
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px">'+
      '<span style="font-size:12px;font-weight:600;color:'+c+'">'+lb+'</span>'+
      (v.valor?'<span class="c-val">'+fc(v.valor)+'</span>':'')+
      '</div><div style="font-size:11px;color:var(--tx3);margin-top:3px">'+fd(v.updatedAt)+'</div>'+
      '<div class="btn-row" onclick="event.stopPropagation()">'+
      '<button class="btn bgold bsm" onclick="event.stopPropagation();reabrir(\''+v.id+'\')">↩ Reabrir</button>'+
      '</div></div>';
  });
  html+='</div>';
  m.innerHTML=html;
}

// ═══ PAINEL LATERAL ════════════════════════════════
function abrirPainel(id){

  var tl=hist.map(function(h,i){
    var last=i===hist.length-1;
    var cc={locadora:'#E89030',documentacao:'#4A88E0',boleto:'#38C880',liberacao:'#C8A044',cancelado_arq:'#E05050',finalizado:'#38C880'}[h.coluna||'']||'#888';
    var ico={criado:'📋',enviado_locadora:'🏢',contraproposta:'📈',aprovado_locadora:'✅',cancelado:'✕',docs_solicitados:'📄',docs_enviados:'📤',boleto_recebido:'🧾',boleto_pago:'💰',liberado:'🔓',finalizado:'✓',movido:'→'}[h.tipo]||'●';

      '</div>'+
      '<div class="tl-c">'+
      '<div class="tl-msg">'+feedMsg(h)+'</div>'+
      '<div class="tl-time">'+fdt(h.data)+(h.resp?' → <strong style="color:var(--gold)">'+h.resp+'</strong>':'')+'</div>'+
      (h.obs?'<div class="tl-obs">'+h.obs+'</div>':'')+

  }).join('');

  // Banner de permissão
  var permBanner='';
  if(!isFin){
    if(pode&&acao){

    } else if(!pode){

    }

  // Botões
  var btns='';

        btns+='<button class="btn bwarn bsm" onclick="mv(\''+id+'\',\'aguardando_locadora\',\'locadora\',\'enviado_locadora\')">🏢 Confirmei — Enviado</button>';
      if(v.substatus==='aguardando_locadora'){
        btns+='<button class="btn bok bsm" onclick="mCol(\''+id+'\',\'documentacao\',\'aprovado_locadora\',\'Documentação\')">✅ Aprovado</button>';
        btns+='<button class="btn bpurple bsm" onclick="fPainel();aContra(\''+id+'\')">📈 Contraproposta</button>';
        btns+='<button class="btn bred bsm" onclick="cancelar(\''+id+'\')">✕ Cancelar</button>';
      }
      if(v.substatus==='contraproposta'){
        btns+='<button class="btn bok bsm" onclick="mCol(\''+id+'\',\'documentacao\',\'aprovado_locadora\',\'Documentação\')">✅ Aceitar</button>';
        btns+='<button class="btn bred bsm" onclick="cancelar(\''+id+'\')">✕ Cancelar</button>';
      }
    }
    if(v.coluna==='documentacao'){
      if(v.substatus==='aguardando_docs'||!v.substatus)
        btns+='<button class="btn bblue bsm" onclick="mv(\''+id+'\',\'docs_enviados\',\'documentacao\',\'docs_enviados\')">📤 Docs Enviados</button>';
      if(v.substatus==='docs_enviados')
        btns+='<button class="btn bok bsm" onclick="mCol(\''+id+'\',\'boleto\',\'docs_enviados\',\'Boleto\')">💰 Ir para Boleto</button>';
    }

        btns+='<button class="btn bok bsm" onclick="fPainel();aBoleto(\''+id+'\')">🧾 Boleto Recebido</button>';

      if(v.substatus==='boleto_pago')
        btns+='<button class="btn bgold bsm" onclick="mCol(\''+id+'\',\'liberacao\',\'boleto_pago\',\'Liberação\')">🔓 Ir para Liberação</button>';

  var waHtml='<div class="psec"><div class="pt">Ações Rápidas WhatsApp</div>'+
    '<div class="wa-grid">'+
    '<button class="wa-btn" onclick="cpWA(\'proposta\',\''+id+'\')">📋 Copiar proposta</button>'+
    '<button class="wa-btn" onclick="aWA(\''+id+'\')">📤 Abrir WhatsApp</button>'+

    '<button class="wa-btn" onclick="cpWA(\'boleto\',\''+id+'\')">💰 Boleto pago</button>'+
    '<button class="wa-btn" onclick="cpWA(\'liberacao\',\''+id+'\')">🔓 Liberação</button>'+
    '</div></div>';

  var d=document.createElement('div');d.className='pov';d.id='pOv';
  d.onclick=function(ev){if(ev.target===d)fPainel();};
  d.innerHTML='<div class="panel">'+
    '<div class="ph">'+
    '<div>'+
    '<div style="font-size:16px;font-weight:700;color:var(--tx);margin-bottom:3px">'+v.modelo+'</div>'+
    '<div style="font-size:14px;font-weight:700;color:var(--gold);font-family:\'Courier New\',monospace;letter-spacing:.1em">'+v.placa+'</div>'+
    '<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px">'+
    '<span style="font-size:11px;font-weight:600;padding:3px 9px;border-radius:99px;background:'+col.color+'18;color:'+col.color+';border:1px solid '+col.color+'33">'+col.icon+' '+col.l+'</span>'+
    (!isFin?'<span class="c-timer '+t.cls+'">⏱ '+t.lbl+'</span>':'')+

    '<button onclick="fPainel()" style="background:var(--s2);border:1px solid var(--line);border-radius:6px;width:30px;height:30px;cursor:pointer;color:var(--tx3);font-size:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0">×</button>'+
    '</div>'+
    '<div class="pb">'+
    permBanner+

     v.locadora?['Locadora',v.locadora]:[],
     v.cnpj?['CNPJ',v.cnpj]:[],
     ['Valor',fc(v.valor)],['Responsável',v.resp],
     v.substatus?['Status',SSL[v.substatus]||v.substatus]:[],
     v.boleto_valor?['Valor Boleto',fc(v.boleto_valor)]:[],
     v.boleto_venc?['Venc. Boleto',fd(v.boleto_venc)]:[],
     v.data_lib?['Data Liberação',fd(v.data_lib)]:[],
     ['Criado em',fdt(v.createdAt)],
    ].filter(function(r){return r&&r.length;}).map(function(r){
      return'<div class="irow"><span style="color:var(--tx3)">'+r[0]+'</span><span style="font-weight:600">'+r[1]+'</span></div>';
    }).join('')+'</div>'+
    (v.obs?'<div class="psec"><div class="pt">Observações</div><div style="background:var(--bg);border-radius:var(--rs);padding:10px;font-size:13px;color:var(--tx2);font-style:italic;line-height:1.5">'+v.obs+'</div></div>':'')+
    (v.contraproposta&&v.contraproposta.valor?'<div class="psec"><div style="background:var(--pdim);border:1px solid var(--pb);border-radius:var(--rs);padding:10px;font-size:13px;color:#C090FF;animation:cpulse 2s ease-in-out infinite">📈 Contraproposta: <strong>'+fc(v.contraproposta.valor)+'</strong>'+(v.valor?' (original: '+fc(v.valor)+')':'')+(v.contraproposta.obs?'<br><em style="opacity:.7">'+v.contraproposta.obs+'</em>':'')+'</div></div>':'')+

  document.body.appendChild(d);

// ═══ AÇÕES ═════════════════════════════════════════
function mv(id,novoSS,col,tipo){
  var v=VEI.find(function(x){return x.id===id;});if(!v)return;
  var h=(v.historico||[]).concat([{tipo:tipo,data:now(),por:U.nome,coluna:col}]);
  db.collection('veiculos3').doc(id).update({substatus:novoSS,updatedAt:now(),atualizadoPor:U.nome,historico:h})
  .then(function(){fPainel();notify(SSL[novoSS]||novoSS);})
  .catch(function(err){notify('Erro: '+err.message,'err');});
}

function mCol(id,novaCol,tipo,destNome){
  var d=document.createElement('div');d.className='mov';d.id='mOv';
  var col=getCol(novaCol);
  var firstSS={documentacao:'aguardando_docs',boleto:'aguardando_boleto',liberacao:'aguardando_liberacao'};

    '<div class="mt">'+col.icon+' Mover para '+col.l+'</div>'+
    '<div style="background:var(--gdim);border:1px solid rgba(200,160,68,.2);border-radius:var(--rs);padding:10px 12px;font-size:13px;color:var(--gold2);margin-bottom:14px">Quem assume esta etapa?</div>'+
    '<div class="mf"><label>Responsável ✱</label><select id="mR"><option value="">Selecionar...</option>'+nomes()+'</select></div>'+
    '<div class="mf"><label>Observação</label><input id="mO" placeholder="Nota opcional..."></div>'+

}
function confMCol(id,novaCol,tipo,destNome){
  var r=gv('mR');if(!r)return notify('Selecione o responsável','err');
  var obs=gv('mO');
  var v=VEI.find(function(x){return x.id===id;});if(!v)return;
  var col=getCol(novaCol);
  var firstSS={documentacao:'aguardando_docs',boleto:'aguardando_boleto',liberacao:'aguardando_liberacao'};
  var h=(v.historico||[]).concat([{tipo:'movido',data:now(),por:U.nome,resp:r,dest:destNome,coluna:novaCol,obs:obs}]);
  // Notificar responsável da próxima etapa
  var usersDest=UD.filter(function(u){return col.perfis.indexOf(u.perfil)>=0&&u.nome!==U.nome&&u.ativo;});
  usersDest.forEach(function(ud){
    addNotif(ud.nome,'🚗 '+v.placa+' — '+v.modelo+' chegou em '+col.l+' para você',id);
  });
  db.collection('veiculos3').doc(id).update({coluna:novaCol,colInicio:now(),substatus:firstSS[novaCol]||'',resp:r,updatedAt:now(),atualizadoPor:U.nome,historico:h})
  .then(function(){fModal();fPainel();notify(col.icon+' Movido para '+col.l);})
  .catch(function(err){notify('Erro: '+err.message,'err');});
}

function voltarCol(id){
  var v=VEI.find(function(x){return x.id===id;});if(!v)return;
  var prev={documentacao:'locadora',boleto:'documentacao',liberacao:'boleto'};
  var ea=prev[v.coluna];if(!ea)return;
  var col=getCol(ea);
  cDlg('Voltar para '+col.icon+' '+col.l+'?',function(){
    var h=(v.historico||[]).concat([{tipo:'movido',data:now(),por:U.nome,dest:col.l,coluna:ea,obs:'Retornou à etapa anterior'}]);
    db.collection('veiculos3').doc(id).update({coluna:ea,colInicio:now(),updatedAt:now(),atualizadoPor:U.nome,historico:h})
    .then(function(){fPainel();notify('← '+col.l);})
    .catch(function(err){notify('Erro','err');});

}

function confBoleto(id){
  var r=gv('mBR'),val=Number(gv('mBV')),ve=gv('mBVe');
  if(!r)return notify('Selecione o responsável','err');
  if(!val||!ve)return notify('Preencha valor e vencimento','err');
  var v=VEI.find(function(x){return x.id===id;});if(!v)return;
  var h=(v.historico||[]).concat([{tipo:'boleto_recebido',data:now(),por:U.nome,resp:r,obs:fc(val)+' · vence '+fd(ve)}]);
  // Notificar Thalis e Elisangela
  UD.filter(function(u){return(u.perfil==='documentacao'||u.perfil==='financeiro')&&u.ativo&&u.nome!==U.nome;}).forEach(function(u){
    addNotif(u.nome,'🧾 Boleto recebido: '+v.placa+' — '+fc(val)+' vence '+fd(ve),id);
  });
  db.collection('veiculos3').doc(id).update({substatus:'boleto_recebido',resp:r,boleto_valor:val,boleto_venc:ve,updatedAt:now(),historico:h})
  .then(function(){fModal();notify('🧾 Boleto registrado — equipe notificada');})
  .catch(function(err){notify('Erro','err');});
}

function finalizar(id){
  cDlg('Finalizar e arquivar este processo?',function(){
    var v=VEI.find(function(x){return x.id===id;});if(!v)return;
    var h=(v.historico||[]).concat([{tipo:'finalizado',data:now(),por:U.nome}]);
    db.collection('veiculos3').doc(id).update({coluna:'finalizado',updatedAt:now(),historico:h})
    .then(function(){fPainel();notify('✓ Finalizado!');})
    .catch(function(err){notify('Erro','err');});
  });
}

function reabrir(id){
  cDlg('Reabrir este processo?',function(){
    var v=VEI.find(function(x){return x.id===id;});if(!v)return;
    var h=(v.historico||[]).concat([{tipo:'movido',data:now(),por:U.nome,dest:'Locadora',obs:'Processo reaberto'}]);
    db.collection('veiculos3').doc(id).update({coluna:'locadora',colInicio:now(),substatus:'proposta_enviada',updatedAt:now(),historico:h})
    .then(function(){setTab('kanban');notify('↩ Reaberto');})
    .catch(function(err){notify('Erro','err');});
  });
}

function excluir(id){
  cDlg('Excluir permanentemente?',function(){
    db.collection('veiculos3').doc(id).delete().then(function(){fPainel();notify('🗑 Excluído');}).catch(function(err){notify('Erro','err');});
  });
}

// WhatsApp
function cpWA(tipo,id){
  var v=VEI.find(function(x){return x.id===id;});if(!v)return;
  var msg=buildWAMsg(tipo,v);
  navigator.clipboard.writeText(msg).then(function(){notify('📋 Copiado!');}).catch(function(){
    var ta=document.createElement('textarea');ta.value=msg;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);notify('📋 Copiado!');
  });
}
function aWA(id){
  var v=VEI.find(function(x){return x.id===id;});if(!v)return;
  var msg=encodeURIComponent(buildWAMsg('proposta',v));
  window.open('https://wa.me/?text='+msg,'_blank');
}

// ═══ NOVO / EDITAR ═════════════════════════════════
function abrirNovo(){
  var d=document.createElement('div');d.className='mov';d.id='mOv';
  d.innerHTML='<div class="modal"><div class="mh"></div>'+
    '<div class="mt">🚘 Novo Processo</div>'+
    '<div class="mf"><label>Responsável ✱</label><select id="nR"><option value="">Selecionar...</option>'+nomes()+'</select></div>'+
    '<div class="mgrid">'+
    '<div class="mf"><label>Placa ✱</label><input id="nP" placeholder="ABC1D23" style="text-transform:uppercase"></div>'+
    '<div class="mf"><label>Valor (R$)</label><input type="number" id="nV" placeholder="63900"></div>'+
    '</div>'+
    '<div class="mf"><label>Modelo ✱</label><input id="nM" placeholder="HB20 Comfort 2023"></div>'+
    '<div class="mf"><label>Locadora</label><input id="nL" placeholder="Localiza, Movida..."></div>'+
    '<div class="mf"><label>CNPJ</label><input id="nCNPJ" placeholder="00.000.000/0001-00"></div>'+
    '<div class="mf"><label>Observações</label><textarea id="nO" placeholder="Notas internas..."></textarea></div>'+
    '<div class="mbtns"><button class="btn bghost" onclick="fModal()">Cancelar</button>'+
    '<button class="btn bgold bfull" onclick="salvarNovo()">Criar Processo</button></div></div>';
  document.body.appendChild(d);
}
function salvarNovo(){
  var p2=gv('nP').toUpperCase().trim(),m2=gv('nM').trim(),r=gv('nR');
  if(!p2||!m2)return notify('Placa e modelo são obrigatórios','err');
  if(!r)return notify('Selecione o responsável','err');
  var data={placa:p2,modelo:m2,locadora:gv('nL'),cnpj:gv('nCNPJ'),valor:Number(gv('nV'))||0,obs:gv('nO'),coluna:'locadora',colInicio:now(),substatus:'proposta_enviada',resp:r,createdAt:now(),updatedAt:now(),criadoPor:U.nome,historico:[{tipo:'criado',data:now(),por:U.nome,resp:r,obs:'Processo criado por '+U.nome,coluna:'locadora'}]};
  // Notificar Leonardo
  var leonardo=UD.find(function(u){return u.perfil==='locadora'&&u.ativo&&u.nome!==U.nome;});
  db.collection('veiculos3').add(data).then(function(ref){
    if(leonardo)addNotif(leonardo.nome,'🚘 Nova proposta: '+p2+' — '+m2+'. Aguarda seu envio à locadora.',ref.id);
    fModal();setTab('kanban');notify('✓ Processo criado!');
  }).catch(function(err){notify('Erro','err');});
}

function aEdit(id){
  var v=VEI.find(function(x){return x.id===id;});if(!v)return;
  var d=document.createElement('div');d.className='mov';d.id='mOv';
  d.innerHTML='<div class="modal"><div class="mh"></div>'+
    '<div class="mt">✎ Editar — '+v.placa+'</div>'+
    '<div class="mgrid">'+
    '<div class="mf"><label>Placa</label><input id="eP" value="'+v.placa+'"></div>'+
    '<div class="mf"><label>Valor</label><input type="number" id="eV" value="'+(v.valor||'')+'"></div>'+
    '</div>'+
    '<div class="mf"><label>Modelo</label><input id="eM" value="'+v.modelo+'"></div>'+
    '<div class="mf"><label>Locadora</label><input id="eL" value="'+(v.locadora||'')+'"></div>'+
    '<div class="mf"><label>CNPJ</label><input id="eCNPJ" value="'+(v.cnpj||'')+'"></div>'+
    '<div class="mf"><label>Observações</label><textarea id="eO">'+(v.obs||'')+'</textarea></div>'+
    '<div class="mbtns"><button class="btn bghost" onclick="fModal()">Cancelar</button>'+
    '<button class="btn bgold" onclick="salvarEdit(\''+id+'\')">Salvar</button></div></div>';
  document.body.appendChild(d);
}
function salvarEdit(id){
  db.collection('veiculos3').doc(id).update({placa:gv('eP').toUpperCase().trim(),modelo:gv('eM').trim(),locadora:gv('eL').trim(),cnpj:gv('eCNPJ').trim(),valor:Number(gv('eV'))||0,obs:gv('eO'),updatedAt:now(),atualizadoPor:U.nome})
  .then(function(){fModal();notify('✓ Atualizado!');}).catch(function(err){notify('Erro','err');});
}
function fModal(){var el=document.getElementById('mOv');if(el)el.remove();}

// ═══ ADMIN ═════════════════════════════════════════
function rAdmin(m){
  if(U.perfil!=='admin'){m.innerHTML='<div style="flex:1;padding:20px"><div class="empty">Acesso restrito</div></div>';return;}
  m.innerHTML='<div style="flex:1;overflow-y:auto;padding:14px" id="aPage"></div>';
  _aTab=_aTab||'usuarios';
  rAPage();
}
var _aTab='usuarios';
function rAPage(){
  var p=document.getElementById('aPage');if(!p)return;
  var tabs=[{k:'usuarios',l:'👥 Usuários'},{k:'prazos',l:'⏱ Prazos'},{k:'msgs',l:'💬 Mensagens WA'}];
  var html='<div style="display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap">';
  tabs.forEach(function(t){html+='<button class="btn '+(_aTab===t.k?'bgold':'bghost')+' bsm" onclick="_aTab=\''+t.k+'\';rAPage()">'+t.l+'</button>';});
  html+='</div>';
  if(_aTab==='usuarios')html+=rAUsr();
  else if(_aTab==='prazos')html+=rAPrazos();
  else if(_aTab==='msgs')html+=rAMsgs();
  p.innerHTML=html;
}
function rAUsr(){
  var pL={locadora:'Locadora',documentacao:'Documentação',financeiro:'Financeiro',operacional:'Operacional',admin:'Admin'};
  var html='<div class="sh"><div class="st">Usuários</div><button class="btn bgold bsm" onclick="aNUsr()">+ Novo</button></div>';
  UD.forEach(function(u){
    html+='<div class="urow">'+
      '<div class="uav">'+u.nome.charAt(0)+'</div>'+
      '<div style="flex:1">'+
      '<div style="font-size:13px;font-weight:600;color:var(--tx)">'+u.nome+'</div>'+
      '<div style="font-size:11px;color:var(--tx3);margin-top:1px">@'+u.login+' · '+(pL[u.perfil]||u.perfil)+(u.ativo?'':' · ⚫ Inativo')+'</div>'+
      '</div>'+
      '<span style="font-size:10px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--gdim);color:var(--gold);border:1px solid rgba(200,160,68,.2)">'+(pL[u.perfil]||u.perfil)+'</span>'+
      '<div style="display:flex;gap:4px">'+
      '<button class="btn bghost bsm" onclick="eUsr(\''+u.id+'\')">✎</button>'+
      (u.perfil!=='admin'?'<button class="btn bred bsm" onclick="dUsr(\''+u.id+'\')">✕</button>':'')+
      '</div></div>';
  });
  return html;
}
function rAPrazos(){
  var rows=[
    {k:'locadora',    ico:'🚘', n:'Locadora',      d:'Prazo esperado para retorno da locadora'},
    {k:'documentacao',ico:'📄', n:'Documentação',  d:'Prazo para envio de documentação'},
    {k:'boleto',      ico:'💰', n:'Boleto',         d:'Prazo para receber e pagar boleto'},
    {k:'liberacao',   ico:'🔓', n:'Liberação',      d:'Prazo para liberação do veículo'},
  ];
  var html='<div class="sh"><div class="st">Prazos por Etapa</div></div>'+
    '<div style="font-size:13px;color:var(--tx3);margin-bottom:14px;line-height:1.6">Configure o prazo máximo de cada etapa em dias. Ao ultrapassar, o card fica vermelho.</div>';
  rows.forEach(function(r){
    html+='<div class="srow">'+
      '<div style="width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;background:var(--gdim)">'+r.ico+'</div>'+
      '<div style="flex:1"><div style="font-size:13px;font-weight:600;color:var(--tx)">'+r.n+'</div>'+
      '<div style="font-size:11px;color:var(--tx3);margin-top:2px">'+r.d+'</div></div>'+
      '<input class="sinp" type="number" id="p_'+r.k+'" value="'+(CF.prazos[r.k]||2)+'" min="1">'+
      '<span style="font-size:11px;color:var(--tx3)">dias</span></div>';
  });
  html+='<div style="margin-top:14px"><button class="btn bgold bfull" onclick="sPrazos()">Salvar Prazos</button></div>';
  return html;
}
function rAMsgs(){
  var ms=[
    {k:'proposta',   l:'📋 Mensagem Proposta'},
    {k:'documentos', l:'📄 Solicitar Documentos'},
    {k:'boleto',     l:'💰 Boleto Pago'},
    {k:'liberacao',  l:'🔓 Liberação'},
  ];
  var html='<div class="sh"><div class="st">Mensagens WhatsApp</div></div>'+
    '<div style="font-size:13px;color:var(--tx3);margin-bottom:14px;line-height:1.6">Use as variáveis: <strong style="color:var(--gold)">{modelo} {placa} {valor} {cnpj}</strong></div>';
  ms.forEach(function(msg){
    html+='<div style="margin-bottom:14px">'+
      '<label style="display:block;font-size:11px;font-weight:600;color:var(--tx3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px">'+msg.l+'</label>'+
      '<textarea class="wa-edit" id="msg_'+msg.k+'">'+(CF.msgs[msg.k]||'')+'</textarea></div>';
  });
  html+='<button class="btn bgold bfull" onclick="sMsgs()">Salvar Mensagens</button>';
  return html;
}
function sPrazos(){
  CF.prazos.locadora=Number(gv('p_locadora'))||2;
  CF.prazos.documentacao=Number(gv('p_documentacao'))||1;
  CF.prazos.boleto=Number(gv('p_boleto'))||3;
  CF.prazos.liberacao=Number(gv('p_liberacao'))||4;
  svC(CF);notify('✓ Prazos salvos!');rAPage();
}
function sMsgs(){
  CF.msgs.proposta=gv('msg_proposta');
  CF.msgs.documentos=gv('msg_documentos');
  CF.msgs.boleto=gv('msg_boleto');
  CF.msgs.liberacao=gv('msg_liberacao');
  svC(CF);notify('✓ Mensagens salvas!');
}
function aNUsr(){
  var d=document.createElement('div');d.className='mov';d.id='mOv';
  d.innerHTML='<div class="modal"><div class="mh"></div><div class="mt">+ Novo Usuário</div>'+
    '<div class="mgrid">'+
    '<div class="mf"><label>Nome ✱</label><input id="uN" placeholder="Nome completo"></div>'+
    '<div class="mf"><label>Login ✱</label><input id="uL" placeholder="sem espaços"></div>'+
    '</div><div class="mgrid">'+
    '<div class="mf"><label>Senha ✱</label><input type="password" id="uS" placeholder="mínimo 4 chars"></div>'+
    '<div class="mf"><label>Perfil</label><select id="uP">'+
    '<option value="locadora">Locadora</option>'+
    '<option value="documentacao">Documentação</option>'+
    '<option value="financeiro">Financeiro</option>'+
    '<option value="operacional">Operacional</option>'+
    '<option value="admin">Admin</option>'+
    '</select></div></div>'+
    '<div class="mbtns"><button class="btn bghost" onclick="fModal()">Cancelar</button>'+
    '<button class="btn bgold" onclick="sNUsr()">Criar</button></div></div>';
  document.body.appendChild(d);
}
function sNUsr(){
  var n=gv('uN').trim(),l=gv('uL').trim().toLowerCase(),s=gv('uS').trim(),p2=gv('uP');
  if(!n||!l||!s)return notify('Preencha todos os campos','err');
  if(s.length<4)return notify('Senha mínimo 4 caracteres','err');
  if(UD.find(function(u){return u.login===l;}))return notify('Login já existe','err');
  UD.push({id:Date.now().toString(),nome:n,login:l,senha:s,perfil:p2,etapas:[p2==='admin'?'all':p2],ativo:true});
  svU(UD);fModal();rAPage();notify('✓ Usuário criado!');
}
function eUsr(id){
  var u=UD.find(function(x){return x.id===id;});if(!u)return;
  var d=document.createElement('div');d.className='mov';d.id='mOv';
  d.innerHTML='<div class="modal"><div class="mh"></div><div class="mt">✎ Editar — '+u.nome+'</div>'+
    '<div class="mgrid">'+
    '<div class="mf"><label>Nome</label><input id="euN" value="'+u.nome+'"></div>'+
    '<div class="mf"><label>Login</label><input id="euL" value="'+u.login+'"></div>'+
    '</div><div class="mgrid">'+
    '<div class="mf"><label>Nova Senha (vazio = manter)</label><input type="password" id="euS" placeholder="••••••••"></div>'+
    '<div class="mf"><label>Perfil</label><select id="euP">'+
    ['locadora','documentacao','financeiro','operacional','admin'].map(function(p2){
      return'<option value="'+p2+'"'+(u.perfil===p2?' selected':'')+'>'+
        {locadora:'Locadora',documentacao:'Documentação',financeiro:'Financeiro',operacional:'Operacional',admin:'Admin'}[p2]+
        '</option>';
    }).join('')+'</select></div></div>'+
    '<div class="mf"><label>Status</label><select id="euA">'+
    '<option value="1"'+(u.ativo?' selected':'')+'>Ativo</option>'+
    '<option value="0"'+(!u.ativo?' selected':'')+'>Inativo</option>'+
    '</select></div>'+
    '<div class="mbtns"><button class="btn bghost" onclick="fModal()">Cancelar</button>'+
    '<button class="btn bgold" onclick="sEUsr(\''+id+'\')">Salvar</button></div></div>';
  document.body.appendChild(d);
}
function sEUsr(id){
  var u=UD.find(function(x){return x.id===id;});if(!u)return;
  u.nome=gv('euN').trim()||u.nome;
  u.login=gv('euL').trim().toLowerCase()||u.login;
  u.perfil=gv('euP')||u.perfil;
  u.etapas=[u.perfil==='admin'?'all':u.perfil];
  u.ativo=gv('euA')==='1';
  var ns=gv('euS').trim();if(ns&&ns.length>=4)u.senha=ns;
  svU(UD);fModal();rAPage();notify('✓ Atualizado!');
}
function dUsr(id){
  cDlg('Remover este usuário?',function(){
    UD=UD.filter(function(u){return u.id!==id;});
    svU(UD);rAPage();notify('Removido');
  });
}
</script>
