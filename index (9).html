<!DOCTYPE html>
<html lang="pt-BR">

<title>Catálogo de Veículos | TH Auto Repasse</title>
<style>
:root{--navy:#0e2238;--ink:#1b2733;--mut:#64748b;--bg:#f3f5f8;--card:#fff;--line:#e2e8f0;--acc:#d9480f;--acc2:#fff4ec;--ok:#15803d;--ap:#b45309;--rp:#b91c1c;--no:#64748b}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
button,input,select{font:inherit}
.top{background:var(--navy);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.top h1{margin:0;font-size:20px;letter-spacing:.3px}
.top h1 span{color:#ffb27d}
.top p{margin:0;font-size:13px;opacity:.75}
.top .sp{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;background:var(--acc);color:#fff;padding:9px 14px;border-radius:8px;cursor:pointer;text-decoration:none;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:#fff;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--acc);color:var(--acc)}
.btn.wa{background:#1fa855}
.btn.sm{padding:6px 10px;font-size:13px}
.aviso{background:#fff7d6;border-bottom:1px solid #f1d98a;padding:10px 20px;font-size:13px;color:#6b5400}
.layout{display:grid;grid-template-columns:300px 1fr;gap:20px;max-width:1500px;margin:0 auto;padding:20px}
aside{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;align-self:start;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
aside h2{font-size:15px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center}
.busca{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;margin-bottom:10px}
.busca:focus,.fld:focus{outline:2px solid var(--acc);border-color:transparent}
details.fx{border-top:1px solid var(--line);padding:10px 0}
details.fx summary{cursor:pointer;font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 10px;font-size:13px;cursor:pointer;color:var(--ink)}
.chip i{font-style:normal;color:var(--mut);font-size:12px;margin-left:3px}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.chip.on i{color:#ffd9c4}
.chip.zero{opacity:.45}
.lista{margin-top:8px;max-height:230px;overflow:auto;display:flex;flex-direction:column}
.lista label{display:flex;gap:8px;align-items:center;padding:5px 4px;border-radius:6px;cursor:pointer;font-size:14px}
.lista label:hover{background:var(--bg)}
.lista label span{flex:1}
.lista label i{font-style:normal;color:var(--mut);font-size:12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.fld{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
.vazio-f{color:var(--mut);font-size:13px;margin-top:8px}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.bar .cnt{font-weight:700;font-size:16px;margin-right:auto}
.bar .cnt small{font-weight:400;color:var(--mut);font-size:13px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:8px 11px;cursor:pointer;color:var(--mut)}
.seg button.on{background:var(--navy);color:#fff}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.pill{background:var(--acc2);border:1px solid #ffd1b5;color:#8a3208;border-radius:999px;padding:4px 6px 4px 11px;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.pill button{border:0;background:#ffd1b5;color:#8a3208;width:18px;height:18px;border-radius:50%;cursor:pointer;line-height:16px;padding:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--no);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;transition:box-shadow .15s}
.card:hover{box-shadow:0 6px 18px rgba(14,34,56,.1)}
.card.l-ok{border-top-color:var(--ok)}.card.l-apont{border-top-color:var(--ap)}.card.l-rep{border-top-color:var(--rp)}
.card.sel{outline:2px solid var(--acc)}
.c-top{display:flex;justify-content:space-between;align-items:center}
.marca{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);font-weight:700}
.badge{font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px;color:#fff;background:var(--no)}
.b-ok{background:var(--ok)}.b-apont{background:var(--ap)}.b-rep{background:var(--rp)}
.card h3{margin:0;font-size:18px;line-height:1.25}
.card h3 small{display:block;font-size:13px;font-weight:500;color:var(--mut);margin-top:2px}
.meta{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.meta li{background:var(--bg);border-radius:6px;padding:3px 8px;font-size:13px}
.placa{font-family:ui-monospace,Consolas,monospace;font-size:13px;letter-spacing:1.5px;color:var(--mut)}
.preco{display:flex;justify-content:space-between;align-items:flex-end;margin-top:auto;padding-top:6px;border-top:1px dashed var(--line)}
.lbl{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut)}
.preco strong{font-size:22px;color:var(--navy)}
.fipe{text-align:right}
.fipe em{font-style:normal;font-weight:700;font-size:13px;color:var(--ok)}
.valores{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:auto}
.vbox{border-radius:10px;padding:8px 10px;background:var(--bg);border:1px solid var(--line)}
.vbox .lbl{font-weight:700}
.vbox strong{display:block;font-size:20px;line-height:1.2;color:var(--ink)}
.vbox.rep{background:var(--navy);border-color:var(--navy)}
.vbox.rep .lbl{color:#cbd5e1}.vbox.rep strong{color:#fff;font-size:22px}
.margem{display:flex;justify-content:space-between;align-items:center;background:#e8f7ee;color:#166534;border-radius:8px;padding:6px 10px;font-size:14px}
.margem{flex-wrap:wrap;gap:2px 8px}.margem b{font-size:15px;white-space:nowrap}
.btn.laudo{width:100%;justify-content:center;text-align:center;font-size:15px;font-weight:700;padding:10px;background:#fff;border:2px solid var(--navy);color:var(--navy);display:block;border-radius:8px;text-decoration:none}
.btn.laudo:hover{background:var(--navy);color:#fff}
.nolaudo{width:100%;text-align:center;font-size:13px;color:var(--mut);border:1px dashed var(--line);border-radius:8px;padding:8px}
.ufbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.ufbar b{font-size:13px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut)}
.ufbar .chip{font-size:14px;font-weight:600}
.acoes{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.chk{display:flex;gap:6px;align-items:center;font-size:13px;cursor:pointer;margin-right:auto}
.tabela{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:auto}
.tabela table{width:100%;border-collapse:collapse;font-size:14px}
.tabela th{background:var(--navy);color:#fff;text-align:left;padding:10px;font-size:12px;text-transform:uppercase;letter-spacing:.4px;position:sticky;top:0}
.tabela td{padding:9px 10px;border-top:1px solid var(--line)}
.tabela tr.sel{background:var(--acc2)}
.tabela .r{text-align:right}
.mais{text-align:center;margin:18px 0}
.nada{background:#fff;border:1px dashed var(--line);border-radius:12px;padding:40px;text-align:center;color:var(--mut)}
#selbar{position:fixed;left:0;right:0;bottom:0;background:var(--navy);color:#fff;padding:12px 20px;display:none;gap:10px;align-items:center;flex-wrap:wrap;z-index:20;box-shadow:0 -4px 16px rgba(0,0,0,.2)}
#selbar.on{display:flex}
#selbar b{margin-right:auto}
.fbtn{display:none}
dialog{border:0;border-radius:14px;padding:22px;max-width:420px;width:92%;box-shadow:0 20px 50px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(14,34,56,.55)}
dialog h3{margin:0 0 12px}
dialog label{display:flex;gap:8px;align-items:center;padding:6px 0;cursor:pointer}
dialog .fim{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
dialog fieldset{border:1px solid var(--line);border-radius:8px;margin:0 0 10px;padding:6px 12px}
#printArea{display:none}
@media (max-width:900px){
 .layout{grid-template-columns:1fr;padding:12px}
 aside{display:none;position:fixed;inset:0;z-index:30;max-height:none;border-radius:0;top:0}
 aside.aberto{display:block}
 .fbtn{display:inline-flex}
 .fechar{display:inline-flex!important}
}
.fechar{display:none}
@media print{
 @page{size:A4;margin:12mm}
 body{background:#fff}
 #app,dialog,#selbar{display:none!important}
 #printArea{display:block;color:#000;font-size:10.5px}
 #printArea .ph{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid #0e2238;padding-bottom:8px;margin-bottom:10px}
 #printArea h1{margin:0;font-size:22px;color:#0e2238}
 #printArea .ph p{margin:2px 0 0;color:#444}
 #printArea .pf{max-width:55%;text-align:right;color:#333;font-size:10px}
 #printArea table{width:100%;border-collapse:collapse}
 #printArea thead{display:table-header-group}
 #printArea th{background:#0e2238!important;color:#fff!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;text-align:left;padding:5px 6px;font-size:9.5px;text-transform:uppercase}
 #printArea td{padding:4px 6px;border-bottom:1px solid #ccc}
 #printArea tr{break-inside:avoid}
 #printArea .r{text-align:right;white-space:nowrap}
 #printArea tr.grp td{background:#e8edf3!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;font-weight:700;border-bottom:1px solid #0e2238;break-after:avoid}
 #printArea .foot{margin-top:12px;font-size:9.5px;color:#555}
}

   </details>
  </aside>
  <main>
   <div class="ufbar" id="ufbar"></div>
   <div class="bar">
    <div class="cnt" id="cnt"></div>
    <button class="btn ghost fbtn" id="abrirF">☰ Filtros</button>
    <select class="fld" id="ordem" style="width:auto">
     <option value="preco-asc">Menor preço</option><option value="preco-desc">Maior preço</option>

    <button class="btn" id="btnPrint">🖨 Imprimir lista</button>
   </div>
   <div class="pills" id="pills"></div>
   <div id="res"></div>
   <div class="mais" id="mais"></div>
  </main>
 </div>
 <div id="selbar"><b id="selTxt"></b><button class="btn wa" id="selWa">Enviar no WhatsApp</button><button class="btn" id="selPrint">🖨 Imprimir selecionados</button><button class="btn ghost" id="selLimpa">Limpar seleção</button></div>
</div>

<dialog id="dlg">
 <h3>Imprimir lista</h3>
 <fieldset><legend>O que imprimir</legend>
  <label><input type="radio" name="esc" value="filtro" checked> <span id="escF"></span></label>
  <label id="escSelL"><input type="radio" name="esc" value="sel"> <span id="escS"></span></label>

const brl=(n,c=0)=>n==null?'—':n.toLocaleString('pt-BR',{style:'currency',currency:'BRL',minimumFractionDigits:c,maximumFractionDigits:c});
const kmFmt=n=>n==null?'km a consultar':n.toLocaleString('pt-BR')+' km';
const LAUDO={ok:'Laudo aprovado',apont:'Com apontamento',rep:'Laudo reprovado',none:'Laudo pendente'};
const LAUDO_ORDEM=['ok','apont','rep','none'];
const UFS=new Set('AC AL AP AM BA CE DF ES GO MA MT MS MG PA PB PR PE PI RJ RN RS RO RR SC SP SE TO'.split(' '));

function toNumber(v){
 if(typeof v==='number')return isFinite(v)?v:null;
 let s=String(v??'').replace(/[R$\s]/g,'');
 if(!s||/[#A-Za-z]/.test(s))return null;
 if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');
 else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');
 const n=parseFloat(s);return isFinite(n)?n:null;
}
function kmNumber(v){
 let n;
 if(typeof v==='number')n=Math.round(v);
 else{const s=String(v??'').trim();if(!s||/[a-zA-Z#]/.test(s))return null;n=parseInt(s.replace(/\D/g,''),10);}
 if(!isFinite(n)||n<100||n>400000)return null; // valores absurdos = digitação errada → "a consultar"
 return n;
}
function parseDelimited(text){
 text=text.replace(/^\uFEFF/,'');
 const first=text.split(/\r?\n/)[0]||'';
 const d=['\t',';',','].map(c=>[c,first.split(c).length]).sort((a,b)=>b[1]-a[1])[0][0];
 const rows=[];let row=[],cur='',q=false;
 for(let i=0;i<text.length;i++){const c=text[i];
  if(q){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}
  else if(c==='"')q=true;
  else if(c===d){row.push(cur);cur=''}
  else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cur);cur='';rows.push(row);row=[]}
  else cur+=c;
 }
 if(cur!==''||row.length){row.push(cur);rows.push(row)}
 return rows;
}

 [/^Q8 (?=3\.0)/i,'Audi','Q8'],[/^Q8/i,'Audi','Q8 e-tron'],

 [/^VOYAGE/i,'Volkswagen','Voyage']
];
const SIGLAS=new Set(['TSI','TDI','TCE','CVT','AT','LTZ','LT','LS','GL','CS','CD','SE','STD','MPI','FLEX','RS','KWH','WT','4X4','4WD','7S','5S','4P','R7A']);
function bonito(s){
 if(/[a-z]/.test(s))return s;
 return s.split(' ').map(w=>{
  if(/\d/.test(w)||w.length<=2||SIGLAS.has(w))return w==='KWH'?'kWh':w;
  return w[0]+w.slice(1).toLowerCase();
 }).join(' ');
}
function classificar(raw){
 for(const [re,marca,fam] of FAMILIAS){const m=raw.match(re);if(m)return{marca,familia:fam,versao:bonito(raw.slice(m[0].length).replace(/^[\s\/-]+/,'').trim())};}
 const p=raw.split(' ');return{marca:'Outras',familia:bonito(p[0]||'—'),versao:bonito(p.slice(1).join(' '))};
}

const CAMPOS={placa:'placa',modelo:'modelo',anomodelo:'ano',ano:'ano',km:'km',cor:'cor',valorfipe:'fipe',fipe:'fipe',repasse:'repasse',preco:'repasse',uf:'uf',statuslaudo:'laudo',laudo:'laudo',link:'link'};
function matrizParaVeiculos(matrix){
 if(!matrix||!matrix.length)return[];
 const head=matrix[0].map(h=>CAMPOS[norm(h)]||null);
 const vistos=new Set(),out=[];
 for(let i=1;i<matrix.length;i++){
  const r={};matrix[i].forEach((c,j)=>{if(head[j]&&r[head[j]]===undefined)r[head[j]]=c});
  const placa=String(r.placa??'').trim().toUpperCase();
  const fipe0=toNumber(r.fipe);
  const preco=fipe0&&fipe0>0?Math.round((fipe0*CONFIG.PERCENTUAL+CONFIG.ACRESCIMO)*100)/100:toNumber(r.repasse);
  if(!placa||!preco||vistos.has(placa))continue;
  vistos.add(placa);
  const bruto=String(r.modelo??'').trim().replace(/\s+/g,' ').replace(/\s+\d{2}\/\d{2}$/,'');
  const c=classificar(bruto);
  const ano=String(r.ano??'').trim();
  const partes=ano.split('/');let y=(partes[1]||partes[0]||'').trim();if(y.length===2)y='20'+y;
  const ls=norm(r.laudo);
  const laudo=ls.includes('aprov')&&!ls.includes('reprov')?'ok':ls.includes('apont')?'apont':ls.includes('reprov')?'rep':'none';
  const fipe=toNumber(r.fipe);
  const uf=String(r.uf??'').trim().toUpperCase();
  const cor=String(r.cor??'').trim();
  const link=/^https?:\/\//i.test(String(r.link??'').trim())?String(r.link).trim():'';
  const v={id:placa,placa,marca:c.marca,familia:c.familia,versao:c.versao,ano,anoMod:/^\d{4}$/.test(y)?y:'',
   km:kmNumber(r.km),cor:cor?cor[0].toUpperCase()+cor.slice(1).toLowerCase():'',uf:UFS.has(uf)?uf:'',laudo,
   fipe:fipe&&fipe>0?fipe:null,preco,link};
  v.pct=v.fipe?Math.round(v.preco/v.fipe*1000)/10:null;
  v.busca=norm([v.marca,v.familia,v.versao,v.placa,v.cor,v.ano,v.uf].join(' '));
  out.push(v);
 }
 return out;
}

let DATA=[];
const S={q:'',marca:new Set(),familia:new Set(),ano:new Set(),laudo:new Set(),uf:new Set(),cor:new Set(),pmin:null,pmax:null,kmmax:null,ordem:'preco-asc',vista:'grid',pagina:1,sel:new Set()};
const CAMPO={marca:'marca',familia:'familia',ano:'anoMod',laudo:'laudo',uf:'uf',cor:'cor'};
function passa(v,skip){
 for(const k in CAMPO){if(k!==skip&&S[k].size&&!S[k].has(v[CAMPO[k]]))return false}
 if(S.pmin!=null&&v.preco<S.pmin)return false;
 if(S.pmax!=null&&v.preco>S.pmax)return false;
 if(S.kmmax!=null&&(v.km==null||v.km>S.kmmax))return false;
 if(S.q){const t=norm(S.q);const parts=S.q.toLowerCase().split(/\s+/).map(norm).filter(Boolean);if(!parts.every(p=>v.busca.includes(p)))return false;}
 return true;
}
const ORDENS={
 'preco-asc':(a,b)=>a.preco-b.preco,'preco-desc':(a,b)=>b.preco-a.preco,
 'pct-asc':(a,b)=>(a.pct??999)-(b.pct??999),'km-asc':(a,b)=>(a.km??1e9)-(b.km??1e9),
 'ano-desc':(a,b)=>(b.anoMod||0)-(a.anoMod||0)||a.preco-b.preco,
 'modelo':(a,b)=>a.marca.localeCompare(b.marca)||a.familia.localeCompare(b.familia)||a.versao.localeCompare(b.versao)||a.preco-b.preco
};
function filtrados(){return DATA.filter(v=>passa(v)).sort(ORDENS[S.ordem])}
function contar(k){
 const m=new Map();
 DATA.forEach(v=>{if(!passa(v,k))return;const val=v[CAMPO[k]];if(!val)return;m.set(val,(m.get(val)||0)+1)});
 S[k].forEach(x=>{if(!m.has(x))m.set(x,0)});
 return[...m];
}

});
let tq;$('#q').addEventListener('input',e=>{clearTimeout(tq);tq=setTimeout(()=>{S.q=e.target.value;S.pagina=1;render()},180)});
const preco=(id,k)=>$(id).addEventListener('change',e=>{const n=toNumber(e.target.value);S[k]=n&&n>0?n:null;if(S[k]!=null)e.target.value=S[k].toLocaleString('pt-BR');else e.target.value='';S.pagina=1;render()});
preco('#pmin','pmin');preco('#pmax','pmax');
$('#kmmax').onchange=e=>{S.kmmax=e.target.value?+e.target.value:null;S.pagina=1;render()};
$('#ordem').onchange=e=>{S.ordem=e.target.value;S.pagina=1;render()};
$('#vGrid').onclick=()=>{S.vista='grid';$('#vGrid').classList.add('on');$('#vLista').classList.remove('on');render()};
$('#vLista').onclick=()=>{S.vista='lista';$('#vLista').classList.add('on');$('#vGrid').classList.remove('on');render()};
$('#limpar').onclick=()=>{for(const k in CAMPO)S[k].clear();S.pmin=S.pmax=S.kmmax=null;S.q='';['#q','#pmin','#pmax','#kmmax'].forEach(i=>$(i).value='');S.pagina=1;render()};
$('#res').addEventListener('change',e=>{const c=e.target.closest('input[data-sel]');if(!c)return;c.checked?S.sel.add(c.dataset.sel):S.sel.delete(c.dataset.sel);render()});
$('#mais').addEventListener('click',e=>{if(e.target.id==='maisBtn'){S.pagina++;render()}});
$('#btnPrint').onclick=()=>abrirImpressao('filtro');
$('#selPrint').onclick=()=>abrirImpressao('sel');
$('#selLimpa').onclick=()=>{S.sel.clear();render()};
$('#selWa').onclick=()=>{
 const l=DATA.filter(v=>S.sel.has(v.id)).map(v=>`• ${nome(v)} — placa ${v.placa} — ${brl(v.preco)}`).join('\n');
 window.open(waLink(`Olá! Tenho interesse nestes veículos do catálogo:\n${l}`),'_blank');
};
$('#abrirF').onclick=()=>$('#filtros').classList.add('aberto');
$('#fechar').onclick=()=>$('#filtros').classList.remove('aberto');

/* ============ INICIAR ============ */
function iniciar(res){
 DATA=res.list;
 const av=$('#aviso');
 if(!res.fonte)av.innerHTML=`<div class="aviso"><b>Modo demonstração:</b> planilha não encontrada. Coloque o arquivo <code>${CONFIG.FONTES.join('</code> ou <code>')}</code> na mesma pasta deste catálogo.</div>`;
 else av.innerHTML='';
 if(res.fonte&&res.fonte.includes('docs.google.com')){const d=new Date();$('#atualizado').textContent='Lista atualizada em '+d.toLocaleDateString('pt-BR')+' às '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}
 else if(res.data){const d=new Date(res.data);if(!isNaN(d))$('#atualizado').textContent='Atualizado em '+d.toLocaleDateString('pt-BR')}
 S.pagina=1;S.sel.clear();render();
}
if(CONFIG.WHATSAPP){const a=$('#waTop');a.style.display='';a.href=waLink('Olá! Vim pelo catálogo da TH Auto Repasse.')}
if(/[?&]admin/.test(location.search)){
 const l=document.createElement('label');l.className='btn ghost sm';l.style.cursor='pointer';
 l.innerHTML='Testar planilha local <input type="file" accept=".xlsx,.xls,.csv" hidden>';
 $('.top').appendChild(l);
 l.querySelector('input').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  const m=/\.xlsx?$/i.test(f.name)?XLSX.utils.sheet_to_json((w=>w.Sheets[w.SheetNames[0]])(XLSX.read(await f.arrayBuffer(),{type:'array'})),{header:1,raw:true,defval:''}):parseDelimited(await f.text());
  iniciar({list:matrizParaVeiculos(m),fonte:f.name});
 };
}
carregar().then(iniciar);
</script>
</body>
</html>
