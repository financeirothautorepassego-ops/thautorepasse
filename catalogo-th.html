<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TH Auto Repasse – Catálogo B2B</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --gold:        #B8922A;
  --gold-light:  #C9A84C;
  --gold-bg:     rgba(184,146,42,0.08);
  --gold-border: rgba(184,146,42,0.25);
  --bg:          #F5F4F0;
  --surface:     #FFFFFF;
  --surface2:    #F9F8F5;
  --border:      #E8E6E0;
  --border2:     #D8D5CC;
  --text:        #1A1A1A;
  --text-mid:    #5A5750;
  --text-dim:    #9A9590;
  --shadow:      0 1px 3px rgba(0,0,0,0.06), 0 4px 16px rgba(0,0,0,0.04);
  --shadow-hover:0 4px 12px rgba(0,0,0,0.10), 0 12px 32px rgba(0,0,0,0.07);
}

body {
  font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

/* ── HEADER ── */
header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 1px 0 var(--border), 0 2px 8px rgba(0,0,0,0.04);
}

.header-inner {
  max-width: 1100px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 64px;
  gap: 16px;
}

.logo-block {
  display: flex;
  align-items: center;
  gap: 12px;
}

.logo-mark {
  width: 38px;
  height: 38px;
  background: var(--gold);
  border-radius: 9px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.82rem;
  font-weight: 800;
  color: #fff;
  letter-spacing: 0.02em;
  flex-shrink: 0;
}

.logo-text {
  display: flex;
  flex-direction: column;
  line-height: 1.2;
}

.logo-name {
  font-size: 0.85rem;
  font-weight: 700;
  color: var(--text);
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.logo-sub {
  font-size: 0.62rem;
  color: var(--text-dim);
  letter-spacing: 0.04em;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 12px;
}

.header-badge {
  background: var(--gold-bg);
  border: 1px solid var(--gold-border);
  color: var(--gold);
  font-size: 0.65rem;
  font-weight: 700;
  padding: 5px 12px;
  border-radius: 20px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

/* ── BUSCA ── */
.busca-section {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 16px 24px;
}

.busca-inner {
  max-width: 860px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.busca-input-wrap { position: relative; }

.busca-icon {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-dim);
  font-size: 0.85rem;
  pointer-events: none;
}

.busca-inner input[type="text"] {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 11px 16px 11px 40px;
  border-radius: 10px;
  font-size: 0.87rem;
  font-family: inherit;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}

.busca-inner input[type="text"]:focus {
  border-color: var(--gold-light);
  box-shadow: 0 0 0 3px rgba(184,146,42,0.10);
  background: #fff;
}

.busca-inner input::placeholder { color: var(--text-dim); }

.filtros { display: flex; gap: 8px; flex-wrap: wrap; }

.filtros select {
  flex: 1;
  min-width: 140px;
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text-mid);
  padding: 10px 12px;
  border-radius: 10px;
  font-size: 0.83rem;
  font-family: inherit;
  outline: none;
  cursor: pointer;
  transition: border-color 0.2s;
}

.filtros select:focus {
  border-color: var(--gold-light);
  box-shadow: 0 0 0 3px rgba(184,146,42,0.10);
}

/* ── COUNT BAR ── */
.count-bar {
  max-width: 1100px;
  margin: 0 auto;
  padding: 14px 24px 0;
  display: flex;
  align-items: center;
  gap: 7px;
}

.count-bar .dot {
  width: 6px;
  height: 6px;
  background: var(--gold);
  border-radius: 50%;
  animation: pulse 2s infinite;
  flex-shrink: 0;
}

@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.4; transform: scale(0.8); }
}

.count-bar span {
  font-size: 0.72rem;
  color: var(--text-dim);
  letter-spacing: 0.02em;
}

/* ── GRID ── */
.lista {
  max-width: 1100px;
  margin: 0 auto;
  padding: 16px 24px 40px;
  display: grid;
  grid-template-columns: 1fr;
  gap: 12px;
}

@media (min-width: 580px) {
  .lista { grid-template-columns: repeat(2, 1fr); }
}

@media (min-width: 960px) {
  .lista { grid-template-columns: repeat(3, 1fr); }
}

/* ── CARD ── */
.item {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 18px 18px 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  transition: box-shadow 0.2s, transform 0.15s, border-color 0.2s;
  box-shadow: var(--shadow);
  position: relative;
  overflow: hidden;
}

.item:hover {
  box-shadow: var(--shadow-hover);
  transform: translateY(-2px);
  border-color: var(--gold-border);
}

/* faixa dourada sutil no topo do card */
.item::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: linear-gradient(90deg, transparent 0%, var(--gold) 40%, var(--gold-light) 60%, transparent 100%);
  opacity: 0;
  transition: opacity 0.25s;
}

.item:hover::before { opacity: 1; }

/* topo */
.item-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 8px;
}

.item-modelo {
  font-weight: 700;
  font-size: 0.9rem;
  color: var(--text);
  line-height: 1.35;
  flex: 1;
}

.item-codigo {
  background: var(--gold-bg);
  color: var(--gold);
  border: 1px solid var(--gold-border);
  padding: 3px 9px;
  border-radius: 20px;
  font-size: 0.62rem;
  font-family: 'DM Mono', monospace;
  letter-spacing: 0.08em;
  white-space: nowrap;
  flex-shrink: 0;
}

/* meta */
.item-meta { display: flex; flex-direction: column; gap: 4px; }

.meta-row { display: flex; flex-wrap: wrap; gap: 4px 14px; }

.item-meta span {
  font-size: 0.76rem;
  color: var(--text-mid);
}

.item-meta .cor {
  font-size: 0.73rem;
  color: var(--text-dim);
}

/* divider */
.item-divider {
  height: 1px;
  background: var(--border);
}

/* bottom */
.item-bottom {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
}

.item-preco { display: flex; flex-direction: column; gap: 2px; }

.preco-label {
  font-size: 0.6rem;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-weight: 500;
}

.preco-valor {
  color: var(--text);
  font-weight: 800;
  font-size: 0.88rem;
  letter-spacing: -0.01em;
}

.fipe-val {
  font-size: 0.69rem;
  color: var(--text-dim);
  margin-top: 1px;
}

.fipe-val strong {
  color: var(--gold);
  font-weight: 600;
}

/* botões */
.item-btns { display: flex; gap: 6px; flex-shrink: 0; }

.btn-contato {
  background: var(--gold);
  color: #fff;
  border: none;
  padding: 8px 14px;
  border-radius: 8px;
  font-weight: 700;
  font-size: 0.76rem;
  cursor: pointer;
  transition: background 0.15s, transform 0.1s;
  font-family: inherit;
  white-space: nowrap;
}

.btn-contato:hover {
  background: var(--gold-light);
  transform: translateY(-1px);
}

.btn-laudo {
  background: transparent;
  color: var(--text-mid);
  border: 1px solid var(--border2);
  padding: 8px 13px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 0.76rem;
  cursor: pointer;
  transition: all 0.15s;
  font-family: inherit;
  white-space: nowrap;
}

.btn-laudo:hover {
  color: var(--gold);
  border-color: var(--gold-border);
  background: var(--gold-bg);
}

/* ── LOADING / EMPTY ── */
.loading {
  text-align: center;
  padding: 80px 20px;
  color: var(--text-dim);
  grid-column: 1 / -1;
}

.loading .spin {
  font-size: 1.8rem;
  animation: spin 1s linear infinite;
  display: inline-block;
  margin-bottom: 12px;
}

@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

.loading p { font-size: 0.84rem; color: var(--text-dim); margin-top: 8px; }

/* ── FOOTER ── */
footer {
  text-align: center;
  padding: 22px 16px;
  color: var(--text-dim);
  font-size: 0.7rem;
  border-top: 1px solid var(--border);
  letter-spacing: 0.03em;
  background: var(--surface);
}

/* ── MODAL ── */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.45);
  backdrop-filter: blur(6px);
  z-index: 300;
  align-items: center;
  justify-content: center;
  padding: 16px;
}

.modal-overlay.show { display: flex; }

.modal {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 28px 24px 22px;
  max-width: 400px;
  width: 100%;
  box-shadow: 0 24px 80px rgba(0,0,0,0.18);
}

.modal-icon { font-size: 1.6rem; margin-bottom: 10px; text-align: center; }

.modal h3 {
  color: var(--text);
  font-size: 1rem;
  font-weight: 700;
  margin-bottom: 4px;
  text-align: center;
}

.modal-veiculo {
  color: var(--text-dim);
  font-size: 0.73rem;
  margin-bottom: 16px;
  text-align: center;
  font-family: 'DM Mono', monospace;
}

.modal-aviso {
  background: var(--gold-bg);
  border: 1px solid var(--gold-border);
  border-radius: 10px;
  padding: 10px 13px;
  font-size: 0.78rem;
  color: var(--gold);
  margin-bottom: 16px;
  line-height: 1.55;
}

.modal-campos {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 16px;
}

.modal-campos label {
  font-size: 0.68rem;
  color: var(--text-dim);
  display: block;
  margin-bottom: 4px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  font-weight: 600;
}

.modal-campos input {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 10px 13px;
  border-radius: 9px;
  font-size: 0.85rem;
  outline: none;
  font-family: inherit;
  transition: border-color 0.2s, box-shadow 0.2s;
}

.modal-campos input:focus {
  border-color: var(--gold-light);
  box-shadow: 0 0 0 3px rgba(184,146,42,0.10);
}

.modal-sub {
  color: var(--text-dim);
  font-size: 0.7rem;
  margin-bottom: 16px;
  text-align: center;
  line-height: 1.5;
}

.modal-btns { display: flex; gap: 8px; }

.modal-confirm {
  background: var(--gold);
  color: #fff;
  border: none;
  padding: 11px 18px;
  border-radius: 9px;
  font-weight: 700;
  font-size: 0.85rem;
  cursor: pointer;
  flex: 1;
  font-family: inherit;
  transition: background 0.15s;
}

.modal-confirm:hover { background: var(--gold-light); }

.modal-cancel {
  background: transparent;
  color: var(--text-dim);
  border: 1px solid var(--border2);
  padding: 11px 16px;
  border-radius: 9px;
  font-weight: 600;
  font-size: 0.85rem;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.15s;
}

.modal-cancel:hover { color: var(--text); border-color: var(--border2); }

/* ── STATUS BADGE ── */
.status-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 5px 12px;
  border-radius: 20px;
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.04em;
}
.status-reservado  { background: rgba(198,40,40,0.10);  color: #b71c1c; border: 1.5px solid rgba(198,40,40,0.35); }
.status-aguardando { background: rgba(21,101,192,0.12); color: #0d47a1; border: 1.5px solid rgba(21,101,192,0.4); }
.status-vendido    { background: rgba(46,125,50,0.12);  color: #1b5e20; border: 1.5px solid rgba(46,125,50,0.35); }

/* Card com borda colorida por status */
.item-reservado  { border-color: rgba(198,40,40,0.4) !important; }
.item-aguardando { border-color: rgba(21,101,192,0.4) !important; }
.item-vendido    { border-color: rgba(46,125,50,0.4) !important; opacity: 0.65; }

.item-vendido .btn-contato,
.item-vendido .btn-laudo { opacity: 0.4; cursor: not-allowed; pointer-events: none; }

/* Botão de interesse */
.btn-interesse {
  background: transparent;
  color: var(--gold);
  border: 1.5px solid var(--gold-border);
  padding: 8px 13px;
  border-radius: 8px;
  font-weight: 700;
  font-size: 0.76rem;
  cursor: pointer;
  transition: all 0.15s;
  font-family: inherit;
  white-space: nowrap;
}
.btn-interesse:hover { background: var(--gold-bg); }

/* ── CONTADOR VERDE ── */
.card-countdown {
  display: flex;
  align-items: center;
  gap: 6px;
  background: rgba(46,125,50,0.08);
  border: 1px solid rgba(46,125,50,0.25);
  border-radius: 8px;
  padding: 7px 10px;
}

.card-countdown-icon {
  font-size: 0.75rem;
  flex-shrink: 0;
}

.card-countdown-label {
  font-size: 0.68rem;
  color: #2e7d32;
  white-space: nowrap;
}

.card-countdown-time {
  font-size: 0.78rem;
  font-weight: 700;
  font-family: 'DM Mono', monospace;
  color: #2e7d32;
  margin-left: auto;
  white-space: nowrap;
}

.card-countdown.urgente {
  background: rgba(192,57,43,0.05);
  border-color: rgba(192,57,43,0.2);
}

.card-countdown.urgente .card-countdown-time { color: #c0392b; }
.card-countdown.urgente .card-countdown-icon { filter: grayscale(0); }

.countdown-encerrado {
  display: none;
  text-align: center;
  padding: 80px 20px;
  grid-column: 1 / -1;
}

.countdown-encerrado .enc-icon { font-size: 2.5rem; margin-bottom: 14px; }
.countdown-encerrado .enc-titulo { font-size: 1rem; font-weight: 700; color: var(--text); margin-bottom: 6px; }
.countdown-encerrado .enc-sub { font-size: 0.83rem; color: var(--text-dim); line-height: 1.6; }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo-block">
      <div class="logo-mark">TH</div>
      <div class="logo-text">
        <span class="logo-name">Auto Repasse</span>
        <span class="logo-sub">Goiânia · GO</span>
      </div>
    </div>
    <div class="header-right">
      <div class="header-badge">Exclusivo B2B</div>
    </div>
  </div>
</header>

<div class="busca-section">
  <div class="busca-inner">
    <div class="busca-input-wrap">
      <span class="busca-icon">🔍</span>
      <input type="text" id="busca" placeholder="Buscar por modelo, código..." oninput="filtrar()">
    </div>
    <div class="filtros">
      <select id="filtroEstado" onchange="filtrar()"><option value="">📍 Todos os estados</option></select>
      <select id="filtroCidade" onchange="filtrar()"><option value="">🏙️ Todas as cidades</option></select>
    </div>
  </div>
</div>

<div class="count-bar">
  <span class="dot"></span>
  <span id="count"></span>
</div>

<div class="lista" id="lista">
  <div class="loading"><div class="spin">⚙️</div><p>Carregando veículos...</p></div>
</div>

<footer>TH Auto Repasse &nbsp;·&nbsp; Preços sujeitos a aprovação &nbsp;·&nbsp; <span id="dataInfo">Exclusivo B2B</span></footer>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)fecharModal()">
  <div class="modal">
    <div class="modal-icon" id="mIcon"></div>
    <h3 id="mTitulo"></h3>
    <div class="modal-veiculo" id="mVeiculo"></div>
    <div class="modal-aviso" id="mAviso"></div>
    <div class="modal-campos">
      <div>
        <label>Seu nome ✱</label>
        <input type="text" id="mNome" placeholder="Nome completo">
      </div>
      <div>
        <label>Seu WhatsApp ✱</label>
        <input type="tel" id="mTel" placeholder="(62) 99999-9999">
      </div>
    </div>
    <div class="modal-sub">Ao confirmar você será direcionado ao WhatsApp do nosso time.</div>
    <div class="modal-btns">
      <button class="modal-confirm" id="mConfirm"></button>
      <button class="modal-cancel" onclick="fecharModal()">Cancelar</button>
    </div>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBHcpM_BMzo6y98HvlFXwhAwV4Ot5-1gm8",
  authDomain: "th-auto-repasse.firebaseapp.com",
  projectId: "th-auto-repasse",
  storageBucket: "th-auto-repasse.firebasestorage.app",
  messagingSenderId: "227004517822",
  appId: "1:227004517822:web:132ea3f2c140ccfc85bdef"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let todosVeiculos = [], waI = '5562995181314', waL = '5562995181314';
let cfgPctMin = 0.71, cfgPctMax = 0.75, cfgMargem = 0;
let cfgHorarioInicio = '08:00', cfgHorarioFim = '18:00', cfgAtivo = true;
let cfgValidoAte = null;
let _countdownInterval = null;
let statusMapCatalogo = {}; // status em tempo real por placa

let configCarregada = false, veiculosCarregados = false, statusCarregado = false;

function tentarRenderizar() {
  if (configCarregada && veiculosCarregados && statusCarregado) filtrar();
}

// ── CONTADOR NOS CARDS ──
function iniciarContador() {
  if (_countdownInterval) clearInterval(_countdownInterval);
  if (!cfgValidoAte) return;
  const alvo = new Date(cfgValidoAte).getTime();
  if (isNaN(alvo)) return;

  function tick() {
    const diff = alvo - Date.now();

    if (diff <= 0) {
      clearInterval(_countdownInterval);
      document.getElementById('count').textContent = '';
      document.querySelector('.busca-section').style.display = 'none';
      document.getElementById('lista').innerHTML =
        '<div class="countdown-encerrado" style="display:block;grid-column:1/-1">'+
        '<div class="enc-icon">🏁</div>'+
        '<div class="enc-titulo">Lote Encerrado</div>'+
        '<div class="enc-sub">Este lote não está mais disponível.<br>Em breve novos veículos serão publicados.</div>'+
        '</div>';
      return;
    }

    const dias  = Math.floor(diff / 86400000);
    const horas = Math.floor((diff % 86400000) / 3600000);
    const mins  = Math.floor((diff % 3600000) / 60000);
    const segs  = Math.floor((diff % 60000) / 1000);
    const urgente = diff < 7200000;

    // Monta string do tempo
    let tempoStr = '';
    if (dias > 0) tempoStr += dias + 'd ';
    tempoStr += String(horas).padStart(2,'0') + 'h ';
    tempoStr += String(mins).padStart(2,'0') + 'min ';
    tempoStr += String(segs).padStart(2,'0') + 's';

    // Atualiza todos os contadores nos cards
    document.querySelectorAll('.card-countdown').forEach(el => {
      el.querySelector('.card-countdown-time').textContent = tempoStr;
      el.classList.toggle('urgente', urgente);
    });
  }

  tick();
  _countdownInterval = setInterval(tick, 1000);
}

// Config — leitura única
db.collection('catalogo').doc('config').get().then(cfgDoc => {
  if (cfgDoc.exists) {
    const c = cfgDoc.data();
    cfgPctMin = (c.pctMin || 71) / 100;
    cfgPctMax = (c.pctMax || 75) / 100;
    cfgMargem = c.margem || 0;
    if (c.waInteresse) waI = c.waInteresse;
    if (c.waLaudo) waL = c.waLaudo;
    if (c.horarioInicio) cfgHorarioInicio = c.horarioInicio;
    if (c.horarioFim) cfgHorarioFim = c.horarioFim;
    cfgAtivo = c.catalogoAtivo !== false;
    cfgValidoAte = c.validoAte || null;
    iniciarContador();
  }
  configCarregada = true;
  tentarRenderizar();
});

// Veículos — leitura única
db.collection('catalogo').doc('atual').get().then(doc => {
  if (!doc.exists) {
    document.getElementById('lista').innerHTML = '<div class="loading"><p>Nenhum veículo disponível no momento.</p></div>';
    return;
  }
  const data = doc.data();
  todosVeiculos = data.veiculos || [];
  if (data.data) document.getElementById('dataInfo').textContent = 'Atualizado em ' + data.data;

  const estados = [...new Set(todosVeiculos.map(v=>v.estado).filter(Boolean))].sort();
  const selE = document.getElementById('filtroEstado');
  selE.innerHTML = '<option value="">📍 Todos os estados</option>';
  estados.forEach(e => { const o=document.createElement('option'); o.value=e; o.textContent=e; selE.appendChild(o); });

  veiculosCarregados = true;
  tentarRenderizar();
});

// Status — leitura única + refresh a cada 2 minutos
function carregarStatus() {
  db.collection('catalogo').doc('status').get().then(doc => {
    statusMapCatalogo = doc.exists ? (doc.data() || {}) : {};
    statusCarregado = true;
    if (configCarregada && veiculosCarregados) filtrar();
  });
}
carregarStatus();
setInterval(carregarStatus, 120000); // atualiza a cada 2 minutos

function dentroDoHorario() {
  if (!cfgAtivo) return false;
  const agora = new Date();
  const horas = agora.getHours().toString().padStart(2,'0');
  const mins = agora.getMinutes().toString().padStart(2,'0');
  const horaAtual = horas + ':' + mins;
  return horaAtual >= cfgHorarioInicio && horaAtual <= cfgHorarioFim;
}

function calcAprovacao(fipeRaw) {
  if (!fipeRaw || fipeRaw <= 0) return 'consultar';
  const min = Math.floor((fipeRaw * cfgPctMin + cfgMargem) / 100) * 100;
  const max = Math.floor((fipeRaw * cfgPctMax + cfgMargem) / 100) * 100;
  return 'entre R$ ' + min.toLocaleString('pt-BR') + ' e R$ ' + max.toLocaleString('pt-BR');
}

function filtrar() {
  const b = document.getElementById('busca').value.toLowerCase();
  const e = document.getElementById('filtroEstado').value;
  const selC = document.getElementById('filtroCidade');
  const c = selC.value;

  const cidades = [...new Set(todosVeiculos.filter(v=>!e||v.estado===e).map(v=>v.cidade).filter(Boolean))].sort();
  selC.innerHTML = '<option value="">🏙️ Todas as cidades</option>';
  cidades.forEach(cd => { const o=document.createElement('option'); o.value=cd; o.textContent=cd; selC.appendChild(o); });
  if (cidades.includes(c)) selC.value = c;

  const filtrado = todosVeiculos.filter(v => {
    const mb = !b || v.modelo.toLowerCase().includes(b) || v.codigo.toLowerCase().includes(b);
    const me = !e || v.estado === e;
    const mc = !selC.value || v.cidade === selC.value;
    return mb && me && mc;
  });

  renderLista(filtrado);
}

function renderLista(lista) {
  const el = document.getElementById('lista');

  if (!dentroDoHorario()) {
    document.getElementById('count').textContent = '';
    el.innerHTML = '<div class="loading" style="grid-column:1/-1">'+
      '<div style="font-size:2.5rem;margin-bottom:16px">⏰</div>'+
      '<div style="color:var(--gold);font-size:1rem;font-weight:700;margin-bottom:6px">Catálogo Fechado</div>'+
      '<div style="color:var(--text-dim);font-size:0.83rem;line-height:1.7">Disponível das <strong style="color:var(--text-mid)">'+cfgHorarioInicio+'h</strong> às <strong style="color:var(--text-mid)">'+cfgHorarioFim+'h</strong><br>Volte em breve.</div>'+
      '</div>';
    return;
  }

  document.getElementById('count').textContent = lista.length + ' veículo(s) disponível(is)';
  if (!lista.length) {
    el.innerHTML = '<div class="loading" style="grid-column:1/-1"><p>Nenhum veículo encontrado.</p></div>';
    return;
  }
  el.innerHTML = '';
  lista.forEach(v => {
    // Mesma chave que o gerador salva: toUpperCase + sem espaços
    const placaKey = v.placa.toString().toUpperCase().replace(/\s/g,'');
    const status = statusMapCatalogo[placaKey] || v.status || 'disponivel';

    let statusBadge = '';
    let itemClass = 'item';
    if (status === 'reservado')  { statusBadge = '<span class="status-badge status-reservado">🔒 Reservado</span>'; itemClass += ' item-reservado'; }
    if (status === 'aguardando') { statusBadge = '<span class="status-badge status-aguardando">⏳ Proposta já enviada</span>'; itemClass += ' item-aguardando'; }
    if (status === 'vendido')    { statusBadge = '<span class="status-badge status-vendido">🏁 Vendido</span>'; itemClass += ' item-vendido'; }

    // Botões conforme status
    let btnsHtml = '';
    if (status === 'disponivel') {
      btnsHtml = `
        <button class="btn-contato" onclick="abrirModal('contato','${v.codigo}','${v.placa}','${v.modelo.replace(/'/g,"\\'")}')">📲 Contato</button>
        <button class="btn-laudo" onclick="abrirModal('laudo','${v.codigo}','${v.placa}','${v.modelo.replace(/'/g,"\\'")}')">📋 Laudo</button>`;
    } else if (status === 'reservado') {
      btnsHtml = `
        <button class="btn-interesse" onclick="abrirModalInteresse('reservado','${v.codigo}','${v.placa}','${v.modelo.replace(/'/g,"\\'")}')">✋ Tenho Interesse</button>
        <button class="btn-laudo" onclick="abrirModal('laudo','${v.codigo}','${v.placa}','${v.modelo.replace(/'/g,"\\'")}')">📋 Laudo</button>`;
    } else if (status === 'aguardando') {
      btnsHtml = `
        <button class="btn-interesse" onclick="abrirModalInteresse('aguardando','${v.codigo}','${v.placa}','${v.modelo.replace(/'/g,"\\'")}')">🔔 Me Avise</button>
        <button class="btn-laudo" onclick="abrirModal('laudo','${v.codigo}','${v.placa}','${v.modelo.replace(/'/g,"\\'")}')">📋 Laudo</button>`;
    } else if (status === 'vendido') {
      btnsHtml = `
        <button class="btn-contato" disabled style="opacity:0.35;cursor:not-allowed">📲 Contato</button>
        <button class="btn-laudo" disabled style="opacity:0.35;cursor:not-allowed">📋 Laudo</button>`;
    }

    const item = document.createElement('div');
    item.className = itemClass;
    item.innerHTML = `
      <div class="item-top">
        <div class="item-modelo">${v.modelo}</div>
        <div class="item-codigo">${v.codigo}</div>
      </div>
      ${statusBadge ? '<div>'+statusBadge+'</div>' : ''}
      <div class="item-meta">
        <div class="meta-row">
          <span>🔑 ${v.placa}</span>
          ${v.km && v.km!=='–' ? '<span>📍 '+v.km+'</span>' : ''}
        </div>
        <div class="meta-row">
          ${v.local ? '<span>📌 '+v.local+'</span>' : ''}
          ${v.cor ? '<span class="cor">🎨 '+v.cor+'</span>' : ''}
        </div>
      </div>
      ${cfgValidoAte ? `
      <div class="card-countdown">
        <span class="card-countdown-icon">⏳</span>
        <span class="card-countdown-label">Disponível por</span>
        <span class="card-countdown-time">--</span>
      </div>` : ''}
      <div class="item-divider"></div>
      <div class="item-bottom">
        <div class="item-preco">
          <span class="preco-label">Sujeito a aprovação</span>
          <span class="preco-valor">${v.fipeRaw ? calcAprovacao(v.fipeRaw) : (v.aprovacao || 'consultar')}</span>
          ${v.fipe ? '<span class="fipe-val">FIPE <strong>'+v.fipe+'</strong></span>' : ''}
        </div>
        <div class="item-btns">
          ${btnsHtml}
        </div>
      </div>`;
    el.appendChild(item);
  });
}

function abrirModalInteresse(status, codigo, placa, modelo) {
  _tipo = 'interesse'; _codigo = codigo; _placa = placa; _modelo = modelo; _statusVeiculo = status;
  document.getElementById('mNome').value = '';
  document.getElementById('mTel').value = '';

  if (status === 'reservado') {
    document.getElementById('mIcon').textContent = '🔒';
    document.getElementById('mTitulo').textContent = 'Veículo Reservado';
    document.getElementById('mAviso').textContent = 'Este veículo está reservado no momento. Caso a negociação não seja concluída, ele voltará a ficar disponível. Deixe seu interesse e entraremos em contato se abrir vaga.';
    document.getElementById('mConfirm').textContent = '✋ Confirmar Interesse';
  } else {
    document.getElementById('mIcon').textContent = '⏳';
    document.getElementById('mTitulo').textContent = 'Aguardando Aprovação';
    document.getElementById('mAviso').textContent = 'Este veículo está em processo de aprovação com a locadora. Deixe seu contato e avisamos assim que a situação for resolvida.';
    document.getElementById('mConfirm').textContent = '🔔 Quero ser Avisado';
  }

  document.getElementById('mVeiculo').textContent = codigo + ' · ' + placa + ' · ' + modelo;
  document.getElementById('modalOverlay').classList.add('show');
  document.getElementById('mConfirm').onclick = enviarInteresseWA;
  setTimeout(() => document.getElementById('mNome').focus(), 100);
}

let _wa='', _tipo='', _codigo='', _placa='', _modelo='', _statusVeiculo='';
function abrirModal(tipo, codigo, placa, modelo) {
  _tipo = tipo; _codigo = codigo; _placa = placa; _modelo = modelo;
  _wa = tipo==='contato' ? waI : waL;
  document.getElementById('mNome').value = '';
  document.getElementById('mTel').value = '';
  if (tipo==='contato') {
    document.getElementById('mIcon').textContent='📲';
    document.getElementById('mTitulo').textContent='Entrar em Contato';
    document.getElementById('mAviso').textContent='⚠️ Envie sua solicitação somente se tiver interesse real no veículo. Solicitações sem intenção de compra prejudicam o atendimento dos demais parceiros.';
    document.getElementById('mConfirm').textContent='✅ Confirmar Interesse';
  } else {
    document.getElementById('mIcon').textContent='📋';
    document.getElementById('mTitulo').textContent='Solicitar Laudo Cautelar';
    document.getElementById('mAviso').textContent='Solicite o laudo somente se estiver avaliando a compra deste veículo. O laudo será enviado após confirmação de disponibilidade.';
    document.getElementById('mConfirm').textContent='📋 Solicitar Laudo';
  }
  document.getElementById('mVeiculo').textContent = codigo + ' · ' + placa + ' · ' + modelo;
  document.getElementById('modalOverlay').classList.add('show');
  document.getElementById('mConfirm').onclick = enviarWA;
  setTimeout(() => document.getElementById('mNome').focus(), 100);
}

function fecharModal() { document.getElementById('modalOverlay').classList.remove('show'); }

function enviarWA() {
  const nome = document.getElementById('mNome').value.trim();
  const tel = document.getElementById('mTel').value.trim();
  if (!nome) { document.getElementById('mNome').focus(); document.getElementById('mNome').style.borderColor='#e57373'; return; }
  if (!tel) { document.getElementById('mTel').focus(); document.getElementById('mTel').style.borderColor='#e57373'; return; }

  let msg = '';
  const tipo_label = _tipo === 'contato' ? 'Interesse no Veículo' : 'Solicitação de Laudo';
  if (_tipo === 'contato') {
    msg = `Olá! Tenho interesse real no veículo abaixo:\n\n🔑 Código: ${_codigo}\n🚗 Placa: ${_placa}\n📋 Modelo: ${_modelo}\n\n👤 Nome: ${nome}\n📲 WhatsApp: ${tel}\n\nAguardo contato da TH Auto Repasse.`;
  } else {
    msg = `Olá! Gostaria de solicitar o laudo cautelar do veículo abaixo:\n\n🔑 Código: ${_codigo}\n🚗 Placa: ${_placa}\n📋 Modelo: ${_modelo}\n\n👤 Nome: ${nome}\n📲 WhatsApp: ${tel}\n\nAguardo retorno da TH Auto Repasse.`;
  }

  try {
    db.collection('propostas').add({
      tipo: tipo_label,
      codigo: _codigo,
      placa: _placa,
      modelo: _modelo,
      nome: nome,
      whatsapp: tel,
      status: 'Aguardando',
      criadoEm: firebase.firestore.FieldValue.serverTimestamp(),
      criadoEmStr: new Date().toLocaleString('pt-BR')
    });
  } catch(e) { console.log('Erro ao registrar:', e); }

  window.open('https://wa.me/'+_wa+'?text='+encodeURIComponent(msg), '_blank');
  fecharModal();
}

function enviarInteresseWA() {
  const nome = document.getElementById('mNome').value.trim();
  const tel = document.getElementById('mTel').value.trim();
  if (!nome) { document.getElementById('mNome').style.borderColor='#e57373'; document.getElementById('mNome').focus(); return; }
  if (!tel)  { document.getElementById('mTel').style.borderColor='#e57373'; document.getElementById('mTel').focus(); return; }

  // Tipo específico conforme status do veículo
  const tipo_label = _statusVeiculo === 'reservado'
    ? 'Interesse em Veículo Reservado'
    : 'Interesse em Veículo Aguardando Aprovação';

  const msg = `Olá! Tenho interesse no veículo abaixo mesmo estando ${_statusVeiculo === 'reservado' ? 'reservado' : 'em aprovação'}:\n\n🔑 Código: ${_codigo}\n🚗 Placa: ${_placa}\n📋 Modelo: ${_modelo}\n\n👤 Nome: ${nome}\n📲 WhatsApp: ${tel}\n\nPor favor me avise se ficar disponível!`;

  try {
    db.collection('propostas').add({
      tipo: tipo_label,
      codigo: _codigo,
      placa: _placa,
      modelo: _modelo,
      nome: nome,
      whatsapp: tel,
      status: 'Aguardando',
      criadoEm: firebase.firestore.FieldValue.serverTimestamp(),
      criadoEmStr: new Date().toLocaleString('pt-BR')
    });
  } catch(e) { console.log('Erro ao registrar interesse:', e); }

  window.open('https://wa.me/' + waI + '?text=' + encodeURIComponent(msg), '_blank');
  fecharModal();
}
</script>
